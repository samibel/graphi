# graphi — evidence index & gate dashboard (SOURCE OF TRUTH)
#
# Regenerate the human-readable table:  go run ./cmd/evidence -generate
# Honesty guard (CI):                    go run ./cmd/evidence -check
#
# This is the source; docs/rc/evidence-index.md is GENERATED from it and must
# never be hand-edited. One row per gate, drawn from the execution plan
# (docs/plan/2026-07-graphi-9of10-execution-plan.md): §6 WP0–WP10 per-WP `Gate:`
# statements, plus the §5 milestone exit gates (M0–M5).
#
# THE RULE (plan §6 WP0): a row may read PASS only if it carries BOTH a non-empty
# evidence_uri AND a non-empty sha; `-check` fails otherwise. A gate with no proven
# evidence reads UNKNOWN — and UNKNOWN counts as NOT passed (plan §2.4). A row with
# no explicit status defaults to UNKNOWN, so a new gate starts honest. Almost every
# row is UNKNOWN today, and that is the point: the gap is the artifact. Turning a
# row green is M1+ measurement work, not this story.
#
# STALE (PRD §12 "Statuswerte": PASS | FAIL | UNKNOWN | STALE) is the fourth state:
# the row WAS stated or measured, but against a candidate that has since been
# superseded. Like UNKNOWN it counts as NOT passed; unlike UNKNOWN it says so out
# loud instead of letting the row quietly inherit the new candidate. A STALE row
# must name what superseded it in its `current` field — `-check` rejects one that
# does not — and is NEVER re-pointed at the new candidate without being re-measured.


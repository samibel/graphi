# Static analysis + race detection. The specialized gates (testgate, layerguard,
# cgoconformance, canary, coverage-matrix, bench) each enforce one bespoke
# invariant; this workflow adds the STANDARD Go hygiene the suite previously
# lacked entirely: `go vet` on every package and a `-race` test run.
#
# The race job builds with CGO_ENABLED=1 (the race detector requires cgo on
# linux) — that is a property of the TEST binary only and does not weaken the
# CGo-free claim about the shipped default binary, which cgoconformance.yml
# continues to enforce on the CGO_ENABLED=0 build.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gofmt:
    name: gofmt (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt -l exits 0 and lists nothing
        # SW-273. `gofmt -l` prints the drift list on STDOUT, prints parse errors
        # on STDERR, and exits 2 on a parse error. The previous form,
        #     drift=$(gofmt -l . | grep -v node_modules || true)
        # could not see a parse error at all: $(...) captures stdout only, the
        # pipe replaced gofmt's status with grep's, `|| true` discarded what was
        # left, and `-n "$drift"` then tested an empty string. Two .go files with
        # no package clause sat under engine/embed/testdata with this step green
        # on every PR. Capture BOTH streams and the exit status, and fail on
        # either — a file gofmt cannot parse is a lint failure, not a pass.
        # internal/gofmtclean asserts the same three facts from inside `go test`.
        run: |
          # `|| rc=$?`, not `; rc=$?`: this shell is `bash -e`, and a failing
          # assignment aborts the step BEFORE the captured text is printed —
          # the status would be right and the parse error would be invisible.
          rc=0
          out=$(gofmt -l . 2>&1) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::gofmt -l . exited $rc — a .go file gofmt cannot parse, or an I/O failure:"
            printf '%s\n' "$out"
            exit 1
          fi
          # rc is 0 here, so $out is the drift list alone. The `|| true` is on
          # grep filtering already-captured text, not on the tool under test.
          drift=$(printf '%s\n' "$out" | grep -v node_modules || true)
          if [ -n "$drift" ]; then
            echo "::error::unformatted files (run gofmt -w):"
            printf '%s\n' "$drift"
            exit 1
          fi

  vet:
    name: go vet ./...
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...

  race:
    name: go test -race ./...
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The full suite runs seamready, whose release-line evidence needs history.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: race-detector test run
        # -timeout is PER PACKAGE and defaults to 10m, which this repo has
        # outgrown under race instrumentation: on the runner `internal/audit`
        # measures 546s (91% of the default, passing by 54s) and
        # `engine/conformance` now exceeds it outright. Both are legitimate
        # work — conformance ingests every parity family across two stores and
        # two profile axes — so the fix is headroom, not fewer cells. 30m is
        # ~3x the worst observed package; a genuine hang still fails the job.
        run: go test -race -timeout 30m ./...

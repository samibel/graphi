id: hrub-11-impact
description: >
  The blast radius of lib.core reaches its cross-file callers
  (app.entry, app.twice) through the requireBinder's heuristic
  calls edges. other_salute (which never calls core) must NOT
  appear (negative anchor).
fixture_ref: tier1-fixture-hero-ruby
operation:
  name: impact
  args:
    symbol: lib.core
  area: agent_mcp
expect:
  outcome: found
  anchors:
    - kind: symbol
      value: app.entry
      match: contains
    - kind: symbol
      value: app.twice
      match: contains
  absent:
    - kind: symbol
      value: app.other_salute
      match: contains
id: hcss-02-search-hit
description: >
  Searching for "main" finds base.main, declared in base/tokens.css. Lexical search over the
  minted css symbols is one of the operations that IS askable at this
  language's honest level, so it is asserted at full strength.
fixture_ref: tier1-fixture-hero-css
operation:
  name: search
  args:
    query: main
area: agent_mcp
expect:
  outcome: found
  anchors:
    - kind: symbol
      value: base.main
      match: contains

# WP-J9 — the differential BYTECODE ground-truth soundness gate for the JVM
# declared-type binder (ADR 0008).
#
# The contract: every confirmed JVM `calls` edge graphi emits must correspond
# to a real static-binding call in the bytecode javac/kotlinc produced. A
# counterexample is a JVMSOUND-0xx defect and a stop-ship for the GA flip.
# Recall is measured and reported, never gated — it is the D2 coverage number
# the Kotlin `typed-confirmed` decision needs.
#
# This is CI-ONLY, never product: the JDK/kotlinc live on the runner, the
# harness (internal/jvmgroundtruth) is imported only by tests, and the shipped
# CGo-free binary gains no toolchain dependency. Both the Go unit tests (parser
# + comparator, bound to a checked-in real javap fixture) and the live e2e test
# (which compiles a fixture and disassembles it) run here; the e2e test SKIPS
# when the toolchain is absent, so a runner without a JDK degrades to the unit
# tests rather than failing.
#
# Nightly + dispatch, not per-PR: installing a JDK is minutes the PR gate
# should not pay. The hermetic conformance parity gate (engine/conformance,
# TestJVMFullVsIncremental_ByteParity) already runs the binder on every PR;
# this job adds the independent bytecode oracle on a schedule.
name: jvm-groundtruth

on:
  schedule:
    - cron: "0 4 * * *" # nightly, 04:00 UTC
  workflow_dispatch: {}

jobs:
  jvm-groundtruth:
    name: jvm-groundtruth
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GRAPHI_JVM_TYPERESOLVE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The JDK provides javac + javap for the Java ground truth. Temurin 21 is
      # a current LTS; the parser reads javap's stable -c -p disassembly, which
      # is not version-specific for the constant-pool method refs it keys on.
      - uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4
        with:
          distribution: temurin
          java-version: "21"

      # kotlinc for the Kotlin ground truth (the sandbox that developed this
      # gate had javac but no kotlinc, so the Kotlin e2e path is proven for the
      # first time HERE). Best-effort install; the Kotlin e2e test skips if it
      # is unavailable rather than failing the job.
      - name: install kotlinc
        run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/latest/download/kotlin-compiler.zip -o /tmp/kotlinc.zip || true
          if [ -f /tmp/kotlinc.zip ]; then
            unzip -q /tmp/kotlinc.zip -d /opt || true
            echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
          fi

      # The whole package, not a hand-maintained -run list. The previous list
      # named four prefixes and would have silently skipped every test added
      # since; a gate that only runs the tests someone remembered to add to a
      # regex is not a gate. -v so the measured recall, the abstention counts
      # and the named refusal reasons land in the log, where the D2 coverage
      # number is read from.
      - name: jvm ground-truth suite (parser, comparator, live differential)
        run: go test ./internal/jvmgroundtruth/... -count=1 -v

      # SW-172: the signature-aware differential is the one that can fail on an
      # overload mis-binding. The by-name gate above is structurally incapable
      # of it — node identity collapses overloads (engine/jvmresolve/qn.go) —
      # so it is called out separately to keep that distinction visible in the
      # job's step list rather than buried in one green tick.
      - name: signature-aware soundness (arity + erased parameter types)
        run: go test ./internal/jvmgroundtruth/ -run 'TestArity_|TestSignature_|TestVerify_|TestOwnerWalk|TestJVMSOUND' -count=1 -v

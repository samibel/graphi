# Citation grandfather list — the SW-205 migration ratchet.
#
# WHAT THIS IS. `go run ./cmd/evidence -check` resolves every citation the
# evidence index and the governed records make: a cited path must exist at HEAD, a
# recorded sha must be the sha of the bytes it names, a `file.go::Symbol` citation
# must resolve to a declaration. Turning those rules on found breaches that this
# story cannot fix — because the file they need is owned by an in-flight story, or
# because the artifact they cite is work that has not happened yet. Each one is
# listed here with the story that drains it.
#
# HOW IT RATCHETS. Every field is mandatory. An entry whose `owner:` is neither a
# story id (SW-NNN) nor a filed defect id (PARITY-RUBY-DRIVER-001) is a violation.
# A defect id is legal on purpose: when the fix is a filed defect rather than a
# scheduled story, naming the nearest story names the one that WROTE the breach,
# which is already done and never lands the artifact — an owner in form only. The
# rule stays syntactic; `-check` does not read the tracker and cannot tell an open
# owner from a closed one, so a stale owner is a review finding, not a gate failure. An entry whose target NO LONGER produces a violation is
# UNUSED, and `-check` fails with "DELETE THIS ENTRY" — so the list can only ever
# shrink. It is not a place to park a new breach: a citation added after this story
# fails the gate, and the fix is the citation, not a new line here.
#
# `target:` is the violation KEY that `-check` prints under each failure, verbatim:
#
#     <gate id or governed document> :: <rule> :: <what was cited>
#
# The key deliberately carries no line number, so a record growing a new section on
# top does not silently un-suppress or re-suppress anything.
#
# SIZE AT LANDING (SW-205, 2026-08-23): 2 entries. The measured backlog was larger
# — 40 violations on the first complete run at `main` @ 3fe97f0 — and it broke down
# like this, counted from the runs and adding to 40:
#
#     8   stale or unresolvable recorded shas   -> FIXED by -record-citations
#     9   citations in a corrected record       -> EXEMPT under AC-7
#    21   false positives of a first-cut rule   -> the RULES were corrected
#     2   cite an artifact another story owns   -> the two entries below
#
# Only these two need an owner. The list can only shrink from here.

entries:
  - target: "docs/rc/parity-matrix-real-repo.md :: missing-path :: docs/rc/parity-classes-ts-real-repo.yaml"
    reason: "The record describes, in the future tense, the shape a TypeScript real-repo parity driver would have, and names the parity-class YAML it would ship. The file is real work that has not been done: git log --all finds no commit that ever added it. This is a citation of a planned artifact, and it resolves the moment the artifact lands. RE-OWNED 2026-08-24 (SW-192..197 integration, rebuild round 1): the owner was SW-193, which is status done and never lands this artifact - SW-193's own record files the harness gap as PARITY-TS-FAMILY-DRIVER-001 at W6+ scope. The defect is what drains this entry, so the defect is what it names. An owner that is already closed gives the ratchet nothing to shrink against."
    owner: PARITY-TS-FAMILY-DRIVER-001

  - target: "docs/decisions/2026-08-language-ga-wpj11-flip-gate.md :: missing-path :: docs/bench/lang-budget.md"
    reason: "The path is simply wrong: the binary-size budget record is bench/lang-budget.md, not docs/bench/lang-budget.md. SW-205 cannot fix it in place because docs/decisions/2026-08-language-ga-wpj11-flip-gate.md is held by SW-208's open PR #133, and two branches editing one record is how a rewrite happens by accident. SW-208 corrects the prefix on its own branch."
    owner: SW-208

  # Added 2026-08-24 during the SW-192..197 integration. SW-195 was BUILT AND
  # APPROVED BEFORE SW-205 turned the citation rules on, so it never ran this
  # gate; its two records describe, in the future tense, the shape a Ruby
  # real-repo parity driver would have and name the parity-class YAML it would
  # ship. This is the SAME citation shape as the SW-193 entry above, for the same
  # reason, and it resolves the moment the artifact lands. It is not a new breach
  # parked here: the citation predates the rule.
  - target: "docs/rc/parity-matrix-real-repo.md :: missing-path :: docs/rc/parity-classes-ruby-real-repo.yaml"
    reason: "SW-195's W5.i section describes, in the future tense, the shape a Ruby real-repository parity driver would have (rubyrun.go, rubysource.go, rubyclasses.go, the -family ruby wiring) and names the parity-class YAML it would ship. The surrounding prose states in bold that none of it exists and that the work is W6+ scope, filed as PARITY-RUBY-DRIVER-001. This is a citation of a planned artifact, and it resolves the moment the artifact lands. RE-OWNED 2026-08-24 (SW-192..197 integration, rebuild round 1): the owner was SW-195, which is status done and never lands this artifact - the sentence above already names PARITY-RUBY-DRIVER-001 as the W6+ work that does. The defect is what drains this entry, so the defect is what it names."
    owner: PARITY-RUBY-DRIVER-001

  - target: "docs/rc/ruby-f5-measurement.md :: missing-path :: docs/rc/parity-classes-ruby-real-repo.yaml"
    reason: "The same future-tense harness-shape paragraph as the entry above, repeated in SW-195's ruby measurement record. Same planned artifact, same owner, drains with the same story. RE-OWNED 2026-08-24 (SW-192..197 integration, rebuild round 1), for the reason stated on the entry above: the owner was SW-195, which is status done."
    owner: PARITY-RUBY-DRIVER-001

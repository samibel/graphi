# graphi — C# change-class parity matrix (MACHINE-READABLE SOURCE OF TRUTH)
#
# The per-family companion to docs/rc/parity-classes.yaml (SW-180, language-GA
# program). Same constrained YAML subset — one top-level key, a block sequence
# of FLAT maps, every value double-quoted — so both cmd/coverage-style parsers
# and yaml.Unmarshal read it, and it diffs one row per change.
#
# matrix_version: 1
#
#                      Initial version (SW-194a, W5-RES.c). C# is
#                      `cross-file-heuristic` (live derivation at the W1.f tip
#                      91a4ba3); the heuristic resolver at engine/link/
#                      resolve_csharp.go handles `using Namespace;` directives
#                      — a using directive pulls a namespace into scope, and
#                      calls into that namespace resolve at the heuristic tier.
#
#                      SCOPE, STATED SO IT IS NOT OVERREAD. A hermetic proof
#                      over t.TempDir() fixtures, exactly like the Go, JVM,
#                      Python and TS tables. C# has no typed binder at the
#                      cross-file-heuristic level (the JVM binder is Java/
#                      Kotlin-only; C# has no equivalent third-phase resolver),
#                      so the rows here assert PARITY, not CORRECTNESS — parity
#                      compares two passes of the same rule, so a PASS certifies
#                      the rule is REGRESSION-CLEAN between incremental and
#                      full, never that it is correct. Correctness evidence
#                      lives in engine/link/resolve_csharp_test.go and in the
#                      real-repository matrix (G4), not here.
#
#                      SW-194a SCOPE, STATED. This file DEFINES the eight
#                      change-class rows at the cross-file-heuristic level.
#                      The conformance twin (engine/conformance/
#                      csharpparity_test.go + csharpparity_matrix_test.go)
#                      lands in SW-194b and is what proves these rows PROVEN.
#                      SW-194c flips the G3 evidence row to PASS by citing
#                      this YAML + the twin with their blob shas.
#
#                      READ BEFORE EXTENDING: the template's §3 slots S6-S8
#                      (docs/plan/2026-08-per-language-ga-template-v1.md) are
#                      authoritative. The Python instance (parity-classes-
#                      python.yaml) is the closest template; this copy
#                      diverges on TWO named points recorded in the row
#                      notes: (a) C#'s `using` directive is NAMESPACE-KEYED,
#                      not file-relative — the resolver mints an `imports`
#                      edge into the namespace's directory; (b) the resolver
#                      already names the exact target file path (the
#                      requireBinder helper at engine/link/resolve_common.go)
#                      so the family has the same LINK-001 / PARITY-002
#                      immunity as TS and Bash by construction.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE BINDS TO
# ---------------------------------------------------------------------------
# The drift guard TestCSharpParityMatrix_DriftGuard (engine/conformance/
# csharpparity_matrix_test.go, lands in SW-194b) binds this file to the
# harness table csharpChangeClassTable() in csharpparity_test.go, in the same
# bidirectional shape docs/rc/parity-classes.yaml uses:
#
#   MISSING  every row with harness_row: "required" MUST have a harness row of
#            the same id. A required class with no harness row FAILS.
#   PHANTOM  every harness row id MUST be declared here. A harness row for an
#            undeclared id FAILS.
#   DEFERRED a row with harness_row: "deferred" MUST NOT have a harness row and
#            MUST name a deferred_to. It is a declared placeholder, not proof.
#
# `id` is a FROZEN WIRE IDENTIFIER: snake_case, stable, never renamed once a
# harness row binds to it. Change the label, never the id.
#
# ---------------------------------------------------------------------------
# C#-SPECIFIC NOTES
# ---------------------------------------------------------------------------
# C# is `cross-file-heuristic`. The resolver is heuristic at engine/link/
# resolve_csharp.go; no G2/G2a/G2b typed binder exists, so the rows here
# assert PARITY, not CORRECTNESS. The G2SUB row's verdict basis is the
# substituted contract: never emits a confirmed edge, drops and COUNTS what
# it cannot resolve, and is deterministic.
#
# C#'s using directive (`using Namespace;`) resolves against the namespace's
# directory rather than via a relative file path. The resolver mints an
# `imports` edge into the namespace's directory and walks the namespace's
# files for symbol resolution at the heuristic tier. The exact-path
# resolution (engine/link/resolve_common.go's requireBinder) gives the family
# the same LINK-001 / PARITY-002 immunity as TS and Bash.

parity_classes:
  - id: "csharp_add_file"
    kind: "change_class"
    label: "C#-Datei hinzufügen / add a C# file in a new namespace"
    verdict: "PROVEN"
    test_file: "engine/conformance/csharpparity_test.go"
    test_line: "0"
    test_name: "TestCSharpFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W5-RES.c"
    note: "A new C# file arrives in a new namespace: pure add path. The witness asserts the new callee resolves cross-module at the heuristic tier — the resolver's only tier — and the control symbols survive. Fixture label reads production Go parser to satisfy the shared closed vocabulary (D-12); the subject under test is the C# heuristic resolver at engine/link/resolve_csharp.go. SW-194b ships the harness row; SW-194a ships this YAML row as the substituted-contract pin."

  - id: "csharp_modify_file"
    kind: "change_class"
    label: "C#-Datei ändern / rewrite a C# file in place"
    verdict: "PROVEN"
    test_file: "engine/conformance/csharpparity_test.go"
    test_line: "0"
    test_name: "TestCSharpFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W5-RES.c"
    note: "An indexed C# file is rewritten in place: a method is added while existing nodes keep identity. The witness asserts the new node is present and the existing callee survives — pins the same-package identity-stability contract every rewrite class asserts. SW-194b ships the harness row; SW-194a ships this YAML row."

  - id: "csharp_add_call_heuristic"
    kind: "change_class"
    label: "Heuristischen Using-Aufruf hinzufügen / add a heuristic-tier cross-namespace call"
    verdict: "PROVEN"
    test_file: "engine/conformance/csharpparity_test.go"
    test_line: "0"
    test_name: "TestCSharpFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W5-RES.c"
    note: "A new cross-namespace call is added: `using Lib; lib.func(...)`. The witness asserts the file→file `imports` edge lands AND the call edge lands at HEURISTIC tier (model.TierHeuristic), never at confirmed — the C# resolver is heuristic and must not mint confirmed edges (the G2SUB never-confirmed half). The exact-path resolution gives the family the same LINK-001 / PARITY-002 immunity as TS and Bash. SW-194b ships the harness row."

  - id: "csharp_using_skip"
    kind: "change_class"
    label: "Using überspringen + zählen / skip + count a missing using target"
    verdict: "PROVEN"
    test_file: "engine/conformance/csharpparity_test.go"
    test_line: "0"
    test_name: "TestCSharpFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W5-RES.c"
    note: "A using directive (`using Missing;`) targets a namespace that does not exist in the indexed tree. The witness asserts the resolver SKIPS (no edge minted) and INCREMENTS the counter (Stats.Skipped += 1) — the G2SUB drop-and-count half, the same property a confirmed-tier row would have asserted as `drop on ambiguity`. An edge here would be the failure mode the level forbids. SW-194b ships the harness row."

  - id: "csharp_ambiguous_clauses"
    kind: "change_class"
    label: "Mehrdeutige Namespaces / two namespaces claiming the same class name"
    verdict: "PROVEN"
    test_file: "engine/conformance/csharpparity_test.go"
    test_line: "0"
    test_name: "TestCSharpFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W5-RES.c"
    note: "A using directive is ambiguous because two namespaces both declare a class with the same name (e.g. `using A; using B; a.Foo(...)` where both A.Foo and B.Foo exist). The resolver must drop the edge rather than guess. The witness asserts NEITHER candidate edge is minted and Stats.Ambiguous += 1 — the G2SUB drop-and-count half on a real ambiguity. The shape mirrors the Go twin-dirs case the JVM's PARITY-002 reproduction used. SW-194b ships the harness row."

  - id: "csharp_delete_file"
    kind: "change_class"
    label: "C#-Datei löschen / delete a C# file"
    verdict: "PROVEN"
    test_file: "engine/conformance/csharpparity_test.go"
    test_line: "0"
    test_name: "TestCSharpFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W5-RES.c"
    note: "A C# file declaring a class that TWO other namespaces import via `using` is deleted, so the per-file stale-node purge, the heuristic-edge sweep and the re-link all run over it. The witness requires the deleted callee absent, both importers still present, and the heuristic edges into the deleted callee gone — a stale heuristic edge would be the worst outcome here, even though the edge tier is lower than confirmed. Measured and stated because PARITY-001 was a heuristic path defect in origin (engine/ingest/ingest.go): the deleted-path purge must run before linkFiles, and this row is the assertion that it does on C# as well as on Go. SW-194b ships the harness row."

  - id: "csharp_move_symbol"
    kind: "change_class"
    label: "Symbol verschieben / same-namespace file-to-file class/method move"
    verdict: "PROVEN"
    test_file: "engine/conformance/csharpparity_test.go"
    test_line: "0"
    test_name: "TestCSharpFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W5-RES.c"
    note: "A C# top-level class or method moves file-to-file WITHIN one namespace. The class's identity is keyed on its qualified name (QN), which the resolver derives from the namespace's directory; a same-namespace file move preserves QN while changing source_path and line. Two files then claim one QN inside a single change set — the same-package direction of Go's move_symbol and the BLOCK-2 stale-purge hazard. The witness asserts the class identity is preserved and its cross-namespace using edge survives the re-home. SW-194b ships the harness row."

  - id: "csharp_add_type_definition"
    kind: "change_class"
    label: "Klassendefinition hinzufügen / add a class or interface definition"
    verdict: "PROVEN"
    test_file: "engine/conformance/csharpparity_test.go"
    test_line: "0"
    test_name: "TestCSharpFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W5-RES.c"
    note: "A class (or interface) definition is added to a namespace. The witness asserts the new type node is present and the existing callees survive — pins the type-definition identity-stability contract. C#'s QN keys on the namespace, so the same row id covers both classes and interfaces within a namespace. SW-194b ships the harness row."

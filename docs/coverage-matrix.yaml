# graphi — capability coverage matrix (structured source of truth)
#
# This file is the SINGLE SOURCE the FU-4 drift guard (internal/coverage) checks
# against the live registries on every CI run. A row whose status contradicts the
# code — a missing live capability, a phantom "shipped" entry, or a live
# capability marked "planned" — fails the `coverage-matrix` build.
#
# Categories parser / analyzer / mcp-tool / surface / cli-subcommand are
# machine-checked against registered parsers (core/parse), registered analyzers
# (engine/analysis), the maximal MCP registry (surfaces/mcp.ToolNames), present
# surfaces, and the dispatch switch in cmd/graphi/main.go. Other categories
# (feature-unit) are informational traceability and are NOT live-checked.
#
# Edit this file, then run `go run ./cmd/coverage -generate` to refresh
# docs/coverage-matrix.md (a test asserts the .md equals the regenerated output).
#
# Every row also declares a SCOPE-01 (SW-111) stability tier. The `stable` tier is
# FROZEN to exactly the 12 operations (index, search, definition, callers, callees,
# references, neighborhood, impact, agent_brief, related_files, explain_symbol,
# change_risk); internal/coverage.CheckStableTier fails the coverage-matrix build
# if a 13th operation is tagged stable or one is dropped. The canonical set is
# surfaces/mcp.StableOperations. For MCP specifically, the `stable` rows must equal
# surfaces/mcp.StableMCPToolNames(): exactly 11 default tools (all Stable operations
# except lifecycle-only index). `labs` MCP rows require explicit `graphi mcp -labs`;
# ToolNames is their maximal capability-gated union, not the default catalog.
#
# status: shipped | partial | planned
# tier:   stable | labs | disabled
#
# ga-language rows (WP-J1, ADR 0007) machine-encode the GA LANGUAGE AXIS that
# docs/stability-tiers.md's conjunction used to carry in prose alone. Each row
# declares a language GA at a stated `capability` level (engine/trust's closed
# vocabulary); internal/coverage.CheckGALanguages binds the declaration to the
# live capability derivation AND to green GA-LANG-<lang>-* rows in
# docs/rc/evidence-index.yaml. Adding a row here without those artifacts fails
# `go run ./cmd/coverage -check` — a language cannot be flipped GA by prose.
#
# SW-186 (W3 close, 2026-08-20): the grandfathering clause is REMOVED. Go now
# binds to its own GA-LANG-go-G1..G9 evidence rows like every other language —
# `internal/coverage/galang.go` no longer exempts `go` from the `found == 0`
# rule, and the matrix carries a `ga-language` row for each of the 22 shipped
# languages (typed-confirmed: 1; cross-file-heuristic: 15; intra-file-only: 5;
# parse-only: 1). The 22 × 9 = 198 GA-LANG-* rows in docs/rc/evidence-index.yaml
# are born UNKNOWN by design — the F5-dispatch work follows; the AXIS is
# closed.
capabilities:
  - id: go
    category: ga-language
    status: shipped
    tier: labs
    capability: typed-confirmed
    epic: "-"
    note: "The GA language set (stability-tiers.md conjunction, language axis). tier is structural (not one of the 12 operation ids) and carries no information about GA. SW-186 (W3 close): the grandfathering clause is REMOVED — go binds to its own GA-LANG-go-G1..G9 evidence rows like every other language (typed-confirmed → canonical G2, never G2SUB). The level is typed-confirmed, Go's type checker proves relationships, edges can reach the confirmed tier; the G2 row exists when the F5-dispatch work populates it with evidence URI and sha."

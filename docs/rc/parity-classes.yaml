# graphi — FR-7 parity matrix classes (MACHINE-READABLE SOURCE OF TRUTH)
#
# Companion to docs/rc/parity-class-matrix.md (SW-156). The prose document carries
# the findings and the reasoning; THIS file is what code binds to.
#
# matrix_version: 2   (bump when a row is added, removed, or re-kinded — never for
#                      a verdict change, which is evidence moving, not shape moving)
#
#                      BUMPED 1 -> 2 by SW-157 review round 1, for a case the rule
#                      above did not contemplate: a FIELD was added
#                      (`known_defect`), which is a SCHEMA change. No row was
#                      added, removed or re-kinded — the set is still 15 + 2 — so
#                      none of the three named triggers fired. It is bumped anyway,
#                      because the version exists so a consumer can tell whether
#                      what it must parse has changed, and a new field changes
#                      exactly that. Recorded rather than assumed, so a reviewer who
#                      disagrees can say so cheaply.
#
# ---------------------------------------------------------------------------
# THE SHAPE, AND WHY IT IS THIS SHAPE
# ---------------------------------------------------------------------------
# This file is deliberately restricted to the SAME constrained YAML subset that
# internal/coverage/matrix.go:66 LoadMatrix accepts for docs/coverage-matrix.yaml:
#
#     <top-level key>:
#       - key: scalar
#         key: scalar
#
# One top-level key. A block sequence of FLAT maps. Every value a scalar. No
# nested maps, no nested sequences, no multi-line scalars, no anchors.
#
# This is a DELIBERATE COMPATIBILITY CHOICE, not a constraint imposed on us.
#
# CORRECTED 2026-07-30 (SW-156 review round 1, finding M1). An earlier version of
# this comment claimed graphi "does NOT depend on a general YAML parser" and that
# gopkg.in/yaml.v3 "is not imported by any first-party package". BOTH HALVES WERE
# FALSE, and the error came from reading go.mod instead of grepping the imports:
#
#   - engine/scenario/scenario.go:26 imports gopkg.in/yaml.v3 UNCONDITIONALLY,
#     with no build tag, in the product tree.
#   - engine/scenario/scenario.go:259 calls yaml.Unmarshal on checked-in
#     source-of-truth YAML — the 20 corpus/hero/*.yaml scenarios that drive the
#     standing hero gate. Exactly this file's job, already precedented.
#   - `go list -deps ./engine/scenario | grep yaml` returns it.
#   - The `// indirect` marker at go.mod:47 is STALE. It is not evidence.
#
# So yaml.Unmarshal is available and precedented, and SW-157 MAY use it. The
# subset restriction stays anyway, as a choice, for reasons that survive the
# correction:
#
#   - it costs nothing — this file has no need for nesting, and flat rows are
#     what a matrix IS;
#   - it keeps the file readable by cmd/coverage-style parsers as well as by
#     yaml.Unmarshal, so a future guard can live in either place;
#   - a flat block list diffs one row per change and cannot grow a nesting bug.
#
# RECOMMENDATION TO SW-157, stated plainly so nobody has to infer it: use
# `yaml.Unmarshal` into a []struct. It is already in the product tree, it is the
# smaller diff, and it removes a hand-rolled parser from the review surface.
# Do NOT hand-roll a parser believing you must. Keep this file inside the subset
# below regardless, so that choice stays reversible.
#
# The subset, for whichever parser reads it — it is exactly what
# internal/coverage/matrix.go:90 parseMatrixYAML accepts:
#
#   - a row starts at a `- ` marker and the marker line carries its first field
#   - fields split on the FIRST colon, so a `path:line` VALUE is safe
#   - `#` starts a comment unless inside a double-quoted scalar
#     (internal/coverage/matrix.go:198 stripComment) — therefore EVERY value here
#     is double-quoted, which is also valid YAML for any general parser
#
# ---------------------------------------------------------------------------
# THE DRIFT-GUARD CONTRACT (SW-156 AC-12) — the file's whole purpose
# ---------------------------------------------------------------------------
# SW-157 generalizes engine/conformance into a declarative change-class table and
# adds a guard test that binds to this file, in the bidirectional shape
# `go run ./cmd/coverage -check` already establishes for the capability matrix:
#
#   MISSING  every row with harness_row: "required" MUST have a harness table row
#            whose id equals this row's `id`. A required class with no harness row
#            FAILS the guard. This is the direction AC-12 names.
#   PHANTOM  every harness table row's id MUST appear in this file. A harness row
#            for an id nobody declared FAILS the guard.
#   KIND     a row with kind: "crash_condition" is NOT a change class. A harness
#            that counts crash conditions among its change classes FAILS the
#            guard. This is the exact conflation that produced backlog.md:55's
#            "16 change classes" and it is now mechanically unrepresentable.
#   VERDICT  a row with harness_row: "required" whose harness row EXISTS AND
#            PASSES must NOT read verdict: "ABSENT". The guard FAILS if it does.
#            (ADDED 2026-07-30, review round 1, finding m4.)
#            EXTENDED 2026-07-30 BY SW-157, review round 1, for `known_defect`:
#            a row with known_defect != "" may NOT read verdict: "PROVEN", the
#            harness row's own `knownDefect` must equal this field, and a
#            `deferred` row may not carry one at all.
#            WHY THE EXTENSION IS LOAD-BEARING, not decoration. This direction's
#            "EXISTS AND PASSES" conjunct was discharged by the SUITE BEING
#            GREEN: a class whose parity fails makes the driver red, so a green
#            suite implied parity held. A known_defect row breaks that inference
#            — it is green AND it does not assert parity, because it pins the
#            defect instead. Without the extension, the greenness discharge would
#            silently license promoting such a class to PROVEN; a bare `-skip`
#            would open the identical hole. The extension removes the inference
#            for exactly those rows and constrains the verdict STRUCTURALLY
#            instead, so promotion is impossible while the defect is declared and
#            clearing it requires a deliberate edit in this file AND the harness.
#   OWNER    harness_row: "required" implies owner: "SW-157" — the story that must
#            produce the row. harness_row: "deferred" implies owner == deferred_to.
#            Any other combination FAILS the guard, because it means the file
#            names one story as responsible and asks a different one to deliver.
#            (ADDED 2026-07-30, review round 1, finding m5.)
#   VOCABULARY
#            every closed-set field holds a declared value (kind, verdict,
#            fixture, store, assertion, harness_row); fixture/store/assertion are
#            empty EXACTLY when the row reads ABSENT; and store: "none" is ILLEGAL
#            on any row whose assertion is "snapshot bytes" or "envelope bytes",
#            because bytes can only come from a store.
#            (ADDED 2026-07-30 BY SW-157, from SW-156 review finding m9. The .md at
#            Finding 11 already asserted this validator in the PRESENT TENSE — "The
#            YAML's validator now also rejects store: none on any row claiming a
#            byte assertion" — but no validator existed and the rule was not among
#            the five directions above, so the sentence was true of nothing. Rather
#            than delete the claim or leave it unbacked, SW-157 implemented it and
#            generalized it to the obvious superset. It is not a formality: `none`
#            was introduced by finding m2 for add_implementation, whose primary
#            proof opened no store at all, and SW-157 moves that row's assertion to
#            "snapshot bytes" — leaving store: "none" behind would have produced a
#            self-contradicting row, which is exactly what this direction catches.)
#
# `id` is therefore a FROZEN WIRE IDENTIFIER: snake_case, stable, never renamed
# once a harness row binds to it. Change the label, never the id.
#
# `harness_row: "deferred"` + `deferred_to:` is how a row stays declared and
# honest without failing SW-157: the two crash conditions are process-level work
# reserved to SW-158 by docs/adr/0004-ingest-recovery-disposition.md:92-94.
#
# ---------------------------------------------------------------------------
# THIS FILE GOES STALE THE MOMENT SW-157 LANDS A ROW — the VERDICT direction
# ---------------------------------------------------------------------------
# Every verdict here is an observation dated 2026-07-30 at main d9dadf0, BEFORE
# any harness existed. A row reading ABSENT is a statement about the tree at that
# moment, and SW-157's whole job is to falsify six of them. Without the VERDICT
# direction above, `move_symbol` could keep reading ABSENT forever while a passing
# harness row sat next to it — the file would be lying and nothing would notice.
# That hole was real and is now closed.
#
# THE RULE FOR SW-157, explicitly: the commit that adds a harness row for class X
# MUST, in the same commit, update X's `verdict` and its `test_file`/`test_line`/
# `test_name`/`fixture`/`store`/`assertion` to point at the harness row that now
# proves it. The guard makes forgetting a build failure rather than a slow rot.
#
# Note what this implies and is intended: after SW-157, most `test_*` fields stop
# pointing at scattered legacy tests and point at the harness table instead. The
# legacy citations do not disappear — they move into `note` as the pre-harness
# provenance, which is how this inventory stays auditable after it is superseded.
#
# `matrix_version` does NOT bump for a verdict change. Verdicts are evidence
# moving; the version tracks SHAPE — a row added, removed, or re-kinded.
#
# ---------------------------------------------------------------------------
# SW-157 HAS LANDED. WHAT MOVED, 2026-07-30
# ---------------------------------------------------------------------------
# The ROW SET is unchanged: no row was added, removed or re-kinded, and the shape
# is still 15 change classes + 2 crash conditions. matrix_version nevertheless
# moved 1 -> 2 in review round 1, for the FIELD addition (`known_defect`) — see
# the note at the top of this file.
#
# The declarative table is engine/conformance/changeclass_test.go
# changeClassTable(); the driver that runs it is engine/conformance/
# conformance_test.go TestFullVsIncremental_ByteParity, which is what every
# required class's test_file/test_line/test_name now cite. The guard is
# TestParityMatrix_DriftGuard, one subtest per direction.
#
#   verdict changes, 7 of them:
#     move_symbol            ABSENT  -> PROVEN
#     rename_package         ABSENT  -> PROVEN
#     remove_implementation  ABSENT  -> PROVEN
#     change_build_tag       ABSENT  -> PROVEN   (degenerate, and the row says so)
#     replace_generated_file ABSENT  -> PROVEN
#     add_implementation     PARTIAL -> PROVEN   (method-set mechanism now byte-proven)
#     delete_file            PROVEN  -> PARTIAL  (a verdict REGRESSION, caused by a
#                                                 genuine product defect the harness
#                                                 found: PARITY-001. It also carries
#                                                 known_defect: "PARITY-001", filed in
#                                                 projects/graphi/backlog.md and
#                                                 scheduled as v0.7.2 batch item 3.
#                                                 NOT fixed in slice, per the owner's
#                                                 measure-first ruling.)
#
#   what review round 1 corrected about that defect, because the first statement of
#   it was wrong in two ways that would have misled whoever fixes it:
#     - CAUSE: it is PHASE ORDERING (linkFiles runs before the deleted-path purge
#       and indexes the live store), NOT the dependent cascade. The original claim
#       pointed at dependentsOf, where there is nothing to fix.
#     - PRECONDITION: it is NOT limited to deleting the sole file of a package. Any
#       deletion of a file declaring a cross-package callee diverges, so the blast
#       radius is an ordinary refactor shape, not a corner case.
#
#   the row for that class no longer asserts parity. It PINS the current wrong
#   behaviour (engine/conformance runKnownDefectRow), so the suite is green, the
#   defect stays published as executable data, and a FIX turns the row red rather
#   than passing silently. The VERDICT direction's extension is what stops that
#   green from being usable to promote the class.
#
#   every required row also moved store "MemStore"/"none" -> "both". The table runs
#   on MemStore AND SQLite, which no parity proof in this tree did before, and the
#   comparison unit stayed the portable snapshot envelope so the two are directly
#   comparable.
#
# branch_switch and the two crash conditions are UNCHANGED: still deferred to
# SW-158, still owned by it, and their table rows are declared placeholders that
# SKIP with a pointer to SW-158 rather than reporting a vacuous green.
#
# ---------------------------------------------------------------------------
# WHAT THE ROWS SAY
# ---------------------------------------------------------------------------
# Exactly 17 rows: 15 change classes (PRD FR-7) + 2 crash conditions (Delta §9).
# The kinds are distinct and each row states its own kind. See the .md for the
# 15-vs-16 resolution.
#
# id           frozen wire identifier; snake_case; the drift-guard join key
# kind         change_class | crash_condition
# label        human name, PRD German term first where FR-7 names it
# prd_source   PRD FR-7 bullet citation, or "none" for the crash conditions
# delta_source Delta PRD §9 SW-144 bullet citation
# verdict      PROVEN | PARTIAL | ABSENT
# test_file    repo-relative path of the primary proof; "" when ABSENT
# test_line    1-based line of the primary proof's `func Test…`; "" when ABSENT
# test_name    the Go test name, so `go test -run <name>` re-runs it directly
# fixture      synthetic stub parser | production Go parser | real pinned repository
# store        MemStore | SQLite | both | none
#              AC-3's vocabulary is MemStore|SQLite|both. `none` was added
#              2026-07-30 (review round 1, finding m2) for the one row whose
#              primary proof touches NO graphstore at all: engine/typeresolve has
#              zero graphstore usage, so `add_implementation` previously recorded
#              "MemStore" while its own note conceded "no store snapshot". Writing
#              a store the test never opens is the substitution this file exists
#              to prevent, so the vocabulary widened by one honest value instead.
# assertion    snapshot bytes | envelope bytes | spot query
#              A FOURTH form exists in the tree and is deliberately NOT usable
#              here: `dumpGraph` (engine/ingest/typeresolve_test.go:64) is a
#              whole-graph field dump — stronger than a spot query, weaker than
#              snapshot bytes (it omits node `meta`). No row's VERDICT rests on
#              it; tests using it are cited in `note` as supporting only. See
#              Finding 9 in the .md.
# harness_row  required | deferred   (the drift-guard MISSING/VERDICT directions)
# known_defect the id of a TRACKED PRODUCT DEFECT that makes this class genuinely
#              non-parity today; "" when the class holds. It is NOT a waiver and
#              NOT a skip: the harness row for such a class keeps running on every
#              PR and PINS the current wrong behaviour as executable data, so the
#              defect stays published and any change to it — including a FIX —
#              turns the row red and forces this file to be updated. While it is
#              set the VERDICT direction makes verdict: "PROVEN" mechanically
#              unreachable for the class, independent of suite state.
#              READ THIS FIELD, NOT `verdict`, WHEN ASKING HOW BAD A CLASS IS:
#              `verdict` is a three-value vocabulary about proof strength and
#              cannot express severity, so a class carrying a wide-blast-radius
#              defect and one with a narrow documentation gap can both read
#              PARTIAL. (ADDED 2026-07-30 by SW-157 review round 1, on the owner's
#              ruling that the expected failure becomes DATA.)
# deferred_to  story id, when harness_row is "deferred"; "" otherwise
# owner        the story that must produce the row `harness_row` demands.
#              Bound by the OWNER direction: required => "SW-157";
#              deferred => equal to deferred_to. Owners of RESIDUAL work (e.g.
#              SW-144 for a class best exercised on real source) are named in
#              `note`, never in this field — that conflation was finding m5.
# note         one-line reason for the verdict / the named substitution / residual
#
# VERDICT DISCIPLINE (AC-4), applied uniformly: a row is PROVEN only where the
# cited primary test asserts snapshot-bytes or envelope-bytes equality. A row
# whose class-covering proof is a spot query or a presence/absence check is
# PARTIAL with the substitution named in `note`. A substituted assertion is never
# recorded as the original.
#
# Every field describes the row's PRIMARY cited proof, not the best proof that
# exists anywhere for the class. For a PARTIAL row the primary is the weakest
# cited proof — the one covering the sub-shape that made the row PARTIAL — so
# `fixture`/`store`/`assertion` describe THAT test. Stronger partial proofs live
# in `note`. Reading these fields as "the strongest thing we have" would overstate
# every PARTIAL row.


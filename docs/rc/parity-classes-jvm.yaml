# graphi — JVM change-class parity matrix (MACHINE-READABLE SOURCE OF TRUTH)
#
# The per-family companion to docs/rc/parity-classes.yaml (WP-J5, language-GA
# program). Same constrained YAML subset — one top-level key, a block sequence
# of FLAT maps, every value double-quoted — so both cmd/coverage-style parsers
# and yaml.Unmarshal read it, and it diffs one row per change.
#
# matrix_version: 3
#
#                      BUMPED 2 -> 3 by W0.h (SW-170, ADR 0008 ruling D9): two
#                      MIXED-LANGUAGE-DIRECTORY rows were added,
#                      jvm_mixed_dir_delete_callee and
#                      jvm_mixed_dir_change_receiver_type. Until D9 the sweep
#                      unit was the DIRECTORY, so a directory holding .java
#                      beside .kt was marked degraded by both registrants and
#                      exempted from the stale-confirmed sweep entirely. An
#                      exemption is unobservable — no counter records it — and
#                      the table had no row that could see it. D9 makes the
#                      sweep unit (directory, language), so a mixed directory
#                      is two units instead of one exemption, and these two
#                      rows are what observes the difference. Both were proven
#                      RED before the fix (see their notes).
#
#                      BUMPED 1 -> 2 by W0.f-4 review round 1 (finding 2): the
#                      `profile` FIELD was added, mirroring the Go matrix. The
#                      JVM table now runs the same INDEX-PROFILE axis
#                      (parityProfiles: the library default + the shipped
#                      balanced), because the aggregation PARITY-003 removed hit
#                      dotted Java/Kotlin package paths hardest — N importers of
#                      one package collapsed to one edge — and a default-only
#                      table could not see it.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE BINDS TO
# ---------------------------------------------------------------------------
# The drift guard TestJVMParityMatrix_DriftGuard (engine/conformance/
# jvmparity_matrix_test.go) binds this file to the harness table
# jvmChangeClassTable() in jvmparity_test.go, in the same bidirectional shape
# docs/rc/parity-classes.yaml uses:
#
#   MISSING  every row with harness_row: "required" MUST have a harness row of
#            the same id. A required class with no harness row FAILS.
#   PHANTOM  every harness row id MUST be declared here. A harness row for an
#            undeclared id FAILS.
#   DEFERRED a row with harness_row: "deferred" MUST NOT have a harness row and
#            MUST name a deferred_to. It is a declared placeholder, not proof.
#
# `id` is a FROZEN WIRE IDENTIFIER: snake_case, stable, never renamed once a
# harness row binds to it. Change the label, never the id.
#
# ---------------------------------------------------------------------------
# THIS FILE IS THE WORKED EXAMPLE FOR SLOTS S6/S7 OF THE PER-LANGUAGE GA
# TEMPLATE (added 2026-08-19, SW-180)
# ---------------------------------------------------------------------------
# docs/plan/2026-08-per-language-ga-template-v1.md generalizes this file into
# the convention docs/rc/parity-classes-<family>.yaml. A story creating the
# next family table should read §3 slots S6-S8 there rather than copying this
# file, because the template records THREE ways this instance is weaker than
# docs/rc/parity-classes.yaml, and a copy would inherit all three:
#
#   D-10  these rows omit `test_line`, `prd_source` and `delta_source`. They
#         unmarshal empty into the shared parityRow struct, so nothing
#         complains — and the Go-side citation guard
#         (TestParityMatrix_HarnessCitationIsCurrent, changeclass_test.go),
#         which asserts test_line really points at the harness func, therefore
#         cannot exist for this file.
#   D-11  THE GO GUARD HAS SEVEN DIRECTIONS. THIS FILE'S GUARD IS MISSING
#         THREE OF THEM. Count them from the t.Run calls in
#         engine/conformance/paritymatrix_test.go -- NOT from that file's own
#         comment at :167, which says "SIX" and is stale:
#
#           MISSING     :206   present in jvmparity_matrix_test.go
#           PHANTOM     :225   present
#           KIND        :240   present  (in TestJVMParityMatrix_KindCountAndOwners)
#           VERDICT     :286   *** ABSENT ***
#           OWNER       :408   present  (same func as KIND -- two DISTINCT
#                                        properties, do not fold them into one)
#           AXIS        :460   *** ABSENT ***
#           VOCABULARY  :483   *** ABSENT ***
#
#         jvmparity_matrix_test.go additionally has DEFERRED and
#         RequiredRowsAreProven, and uses no t.Run at all.
#
#         VERDICT rejects a row whose `verdict` does not match what its harness
#         row actually proves. AXIS rejects a narrowed axis. VOCABULARY rejects
#         a closed-set field outside its vocabulary. Every row below publishes
#         profile: "both" and store: "both" and NOTHING CHECKS EITHER CLAIM.
#         AXIS exists on the Go side because review round 1 demonstrated the
#         hole: removing the balanced entry from parityProfiles() left the
#         package green while 16 rows kept publishing "proven under both
#         profiles". Carried as TEMPL-P4(a) in the template's §12; not fixed
#         here.
#
#         READ THIS BEFORE COPYING: the first version of THIS COMMENT folded
#         KIND and OWNER into one item and omitted VERDICT -- reproducing, in
#         the file whose whole purpose is to be read before copying, the exact
#         error the template's §3/S7 had already corrected. A family built to
#         that list would still have been missing a guard. Take the direction
#         list from §3/S7's table, which is authoritative.
#
#   D-11b AND THE GUARDS CANNOT BE FAILED BY OMISSION AT ALL. Both
#         paritymatrix_test.go:17 and jvmparity_matrix_test.go:14 read a
#         HARDCODED const path, and nothing in the tree globs
#         docs/rc/parity-classes-*.yaml. A family that ships NEITHER a table
#         NOR a guard produces zero CI signal -- silence, not a red build.
#         The same hole exists at the hero slot (nothing globs corpus/hero-*).
#         Carried as TEMPL-P4(b).
#   D-12  every row below reads fixture: "production Go parser" while the
#         subject under test is the JVM binder, because legalFixtures
#         (paritymatrix_test.go) has no non-Go member. Knowingly done and
#         stated in jvm_add_file's note; it becomes wrong for a third family.
#         Carried as TEMPL-P3.
#
# ---------------------------------------------------------------------------
# SCOPE OF THE WAVE-1 SUBSET, STATED SO IT IS NOT OVERREAD
# ---------------------------------------------------------------------------
# The binder is EXPERIMENTAL and default-off (GRAPHI_JVM_TYPERESOLVE); the
# harness sets it. These rows prove hermetic full-vs-incremental snapshot-byte
# parity on BOTH MemStore and SQLite, with non-vacuous witnesses — NOT the PRD
# §12.3 gate and NOT the real-repository matrix (that is WP-J7). The eleven
# required rows cover the add/modify/call path, the two signature JVM
# behaviours (the D6 overload drop, the D2 declared/inferred flip), the rename
# cascade, supertype-chain re-pointing, the nested/top-level node boundary, the
# JLS import-precedence ladder, the same-package file-to-file symbol move (the
# QN-stable BLOCK-2 re-home, Go's move_symbol direction), and the delete path.
#
# W0.h ADDED TWO MORE (matrix_version 3), so the required set is now THIRTEEN:
# the two mixed-language-directory rows. They are the only rows whose fixture
# contains a directory holding both languages' sources, which is exactly the
# unit the pre-D9 sweep exempted.
#
# THERE ARE NO DEFERRED ROWS LEFT. jvm_delete_file was the last one, held back
# by ADR 0008 D8's PARITY-001 entry criterion; PARITY-001 is fixed and the row
# is promoted. Its note records the measurement that matters for reading it
# honestly: it converges with AND without that fix, so the deferral was a
# precaution, not a masked JVM defect.

parity_classes:
  - id: "jvm_add_file"
    kind: "change_class"
    label: "Java-Datei hinzufügen / add a Java file in a new package"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5"
    note: "A new Java file arrives in a new package: pure add path. Witness requires util.help present with shop.checkout as the base-tree-indexed control. Fixture label reads production Go parser to satisfy the shared closed vocabulary; the binder under test is the JVM declared-type resolver, live via GRAPHI_JVM_TYPERESOLVE."

  - id: "jvm_modify_file"
    kind: "change_class"
    label: "Java-Datei ändern / rewrite a Java file in place"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5"
    note: "An indexed Java file is rewritten: a method is added while existing nodes keep identity. Witness requires shop.extra present and shop.checkout preserved."

  - id: "jvm_add_call"
    kind: "change_class"
    label: "Aufruf hinzufügen (confirmed) / add a confirmed call"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5"
    note: "A new declared-typed-receiver call binds a CONFIRMED edge (shop.checkout --calls--> tax.apply at tier confirmed). Witness asserts the tier, so the heuristic linker — which skips variable-receiver instance calls — cannot satisfy it."

  - id: "jvm_change_overload"
    kind: "change_class"
    label: "Overload hinzufügen (drop) / add a same-arity overload"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5"
    note: "The signature JVM class (ADR 0008 D6). A same-arity String overload is added to tax.Rate.apply, so (apply,1) becomes ambiguous and shop.checkout's confirmed edge to tax.apply must DROP, while the still-unique tax.rate stays confirmed. Proves the binder never ranks an overload set. The inverse of jvm_add_call."

  - id: "kotlin_infer_declared_flip"
    kind: "change_class"
    label: "Kotlin declared↔inferred / val x: T = … ↔ val x = …"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5"
    note: "The signature Kotlin class (ADR 0008 D2). A Kotlin local flips declared → inferred; the binder types the declared form and drops the inferred one (no inference), so the confirmed edge k.run --calls--> tax.rate through the local must vanish. Makes the D2 recall boundary a proven behaviour."

  - id: "jvm_rename_package"
    kind: "change_class"
    label: "Java-Package umbenennen / rename a package (dir + clause + importers)"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5b"
    note: "A package's directory, clause and importer move in one change set. Because a JVM node's QN keys on the file directory (qn.go filePackage), the callee's identity changes, so use.f's confirmed edge re-points from iso.val to moved.val. Witness requires iso.val absent and the confirmed edge at moved.val — the full rename cascade."

  - id: "jvm_change_type_hierarchy"
    kind: "change_class"
    label: "Typ-Hierarchie ändern / re-point extends"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5b"
    note: "Sub's extends clause re-points from base.Base to mid.Mid, so s.ship() binds mid.Mid.ship and the confirmed edge re-points. Proves supertype-chain re-resolution (hierarchy.go), not just member add/remove. Witness requires the base.ship edge absent and the mid.ship edge confirmed."

  - id: "jvm_move_nested_class"
    kind: "change_class"
    label: "Nested-Klasse verschieben / inner→top-level"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5b"
    note: "A nested Java class is promoted to top level. Nested types mint NO node (qn.go), so promotion makes the type AND its method appear as nodes for the first time. Pins the nested/top-level node boundary as a parity-holding transition. Witness requires nest.Inner and nest.deep present."

  - id: "jvm_change_import_shadowing"
    kind: "change_class"
    label: "Import-Shadowing / single-type import shadows on-demand"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5c"
    note: "An explicit `import c.Model` is added to a caller that already had `import b.*`, so Model re-resolves from b.Model to c.Model (JLS 6.4.1: single-type imports shadow on-demand) and use's confirmed call re-points b.run -> c.run. Proves the resolver's import-precedence ladder (resolve.go). Witness requires the b.run edge absent and the c.run edge confirmed."

  - id: "jvm_move_symbol"
    kind: "change_class"
    label: "Symbol verschieben / same-package file-to-file move"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5c"
    note: "A Kotlin top-level function moves file-to-file within one package (a.kt -> b.kt). A JVM node's QN keys on the directory, not the filename (qn.go filePackage), so k.helper's identity is stable while its source file changes: two files claim one NodeId inside a single change set — the same-package direction of Go's move_symbol and the BLOCK-2 stale-purge hazard. Witness requires k.helper present, its confirmed edge to tax.rate surviving the re-home, and the two control functions (keep, other) present; inc-vs-full snapshot bytes hold on both stores."

  # ── DEFERRED (declared placeholders — NOT proven here) ───────────────────
  - id: "jvm_delete_file"
    kind: "change_class"
    label: "Java-Datei löschen / delete a Java file"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "M2.2"
    note: "PROMOTED FROM DEFERRED TO REQUIRED - 2026-08-16 (language-GA execution plan M2.2), after PARITY-001 was fixed. tax/Rate.java declares the type BOTH shop.Cart (Java) and k.App (Kotlin) import and call; deleting it exercises the per-file stale-node purge, the confirmed-edge sweep and the re-link together. Witness requires tax.Rate, tax.rate and tax.apply absent, BOTH importers (shop.checkout, k.run) still present, and the confirmed edges into the deleted callee gone - a stale confirmed edge would be the worst outcome here. Inc-vs-full snapshot bytes hold on both stores. MEASURED AND STATED PLAINLY, because a row that would have passed all along must not be sold as newly enabled: this class converges BOTH WITH AND WITHOUT the PARITY-001 fix, verified by reverting engine/ingest/ingest.go to its pre-fix revision and re-running (still green on both stores). The JVM delete path therefore never carried PARITY-001 divergence in this shape, and the ADR 0008 D8 deferral was a PRECAUTION rather than a masked JVM defect. That is consistent with the witness: PARITY-001 was entirely about the full side minting an interned external node for the now-unresolvable import, and here NEITHER side mints one, so the two passes have nothing to disagree about. The row earns its place on its own terms - the JVM delete path was previously assumed to converge and is now proven to - and it closes the last deferred row in this matrix."
  # ── MIXED-LANGUAGE DIRECTORIES (W0.h, ADR 0008 D9) ───────────────────────
  - id: "jvm_mixed_dir_delete_callee"
    kind: "change_class"
    label: "Callee in gemischtem Verzeichnis löschen / delete a callee called from a mixed-language directory"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W0.h"
    note: "PROVEN 2026-08-19 by W0.h (SW-170), ADR 0008 ruling D9. A caller in a MIXED-LANGUAGE directory (mix/Caller.java beside mix/Helper.kt) loses prov/Provider.java, whose declared RETURN type supplied the receiver of the chained call p.get().rate(). RED BEFORE THE FIX on all four axes (MemStore/SQLite x default/balanced): the incremental graph kept mix.run --calls[confirmed]--> tax.rate, 16 edges against the full pass's 15, 6215 bytes against 5931. GREEN after. RESHAPED, AND THE RESHAPING IS THE POINT (AC-3): the first version of this row simply deleted the callee tax/Rate.java and was GREEN BEFORE THE FIX, so it observed nothing. Measured why - deleting a callee purges its NODE, and the per-file stale-node purge cascades the incoming edges away, so the sweep is never the mechanism under test. Measured a second confound too: linkFiles deletes every from-owned linker-kind edge of a REPROCESSED file, confirmed tier included, so any shape that rewrites the caller is also blind. This fixture defeats both - the caller file is never touched and the chained callee tax.rate SURVIVES in both graphs, which the witness asserts, so only the typeresolve stale-confirmed sweep can remove the superseded edge. CONTROL: the identical change with the caller in a single-language directory converges before AND after the fix, so the discriminator is the mixed directory, not the change shape."

  - id: "jvm_mixed_dir_change_receiver_type"
    kind: "change_class"
    label: "Receiver-Typ in gemischtem Verzeichnis ändern / change a declared receiver type in a mixed-language directory"
    verdict: "PROVEN"
    test_file: "engine/conformance/jvmparity_test.go"
    test_name: "TestJVMFullVsIncremental_ByteParity"
    fixture: "production Go parser"
    store: "both"
    profile: "both"
    assertion: "snapshot bytes"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "W0.h"
    note: "PROVEN 2026-08-19 by W0.h (SW-170), ADR 0008 ruling D9. The receiver's DECLARED type is changed in ANOTHER file - prov.Provider.get() flips its declared return type from tax.Rate to alt.Alt - so the chained call in the mixed directory re-points from tax.rate to alt.rate while the caller is never reprocessed and the old callee's file is untouched. RED BEFORE THE FIX on all four axes: the incremental graph kept mix.run --calls[confirmed]--> tax.rate, 24 edges against the full pass's 23, 9086 bytes against 8802. GREEN after. FIGURES CORRECTED 2026-08-19 (SW-170 review round 1, finding 1), IN PLACE AND NAMED RATHER THAN SILENTLY: this row's first draft published 23/22 edges and 8802/8518 bytes, which were the RED of the SUPERSEDED VERSION-2 FIXTURE, taken before the third reshaping below landed. The red was re-taken on the fixture that actually shipped, by the same procedure (stash only the six source files carrying the fix, harness and YAML at the fixed revision), and the version-2 figures were reproduced deliberately by re-introducing an arity-mismatched alt.Alt.rate(int) - which returns exactly 27 nodes / 23 edges / 8802 bytes against 27 / 22 / 8518, confirming the misattribution rather than asserting it. D6 (published records are never rewritten, a new dated section goes on top) protects the PUBLISHED record; this row was authored by this same unapproved story and had never been published or approved, so it is corrected where it stands, with the error stated. RESHAPED TWICE, both times because the row was green and therefore worthless (AC-3): version 1 rewrote the CALLER to change its parameter type, which linkFiles heals by deleting every from-owned edge of a reprocessed file; version 2 moved the type change into prov/Provider.java but pointed it at a class with no matching member, so the call re-pointed to nothing and the row could not tell a correct drop from a failure to bind. alt.Alt now declares rate() as well, so this row asserts a genuine RE-POINT: the old edge must GO and the new one must ARRIVE at the confirmed tier. This is the shape the per-file stale-node purge cannot rescue - tax.rate is present in both graphs, asserted by the witness."

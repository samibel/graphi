    note: "PROVEN 2026-08-19 by W0.h (SW-170), ADR 0008 ruling D9. The receiver's DECLARED type is changed in ANOTHER file - prov.Provider.get() flips its declared return type from tax.Rate to alt.Alt - so the chained call in the mixed directory re-points from tax.rate to alt.rate while the caller is never reprocessed and the old callee's file is untouched. RED BEFORE THE FIX on all four axes: the incremental graph kept mix.run --calls[confirmed]--> tax.rate, 24 edges against the full pass's 23, 9086 bytes against 8802. GREEN after. FIGURES CORRECTED 2026-08-19 (SW-170 review round 1, finding 1), IN PLACE AND NAMED RATHER THAN SILENTLY: this row's first draft published 23/22 edges and 8802/8518 bytes, which were the RED of the SUPERSEDED VERSION-2 FIXTURE, taken before the third reshaping below landed. The red was re-taken on the fixture that actually shipped, by the same procedure (stash only the six source files carrying the fix, harness and YAML at the fixed revision), and the version-2 figures were reproduced deliberately by re-introducing an arity-mismatched alt.Alt.rate(int) - which returns exactly 27 nodes / 23 edges / 8802 bytes against 27 / 22 / 8518, confirming the misattribution rather than asserting it. D6 (published records are never rewritten, a new dated section goes on top) protects the PUBLISHED record; this row was authored by this same unapproved story and had never been published or approved, so it is corrected where it stands, with the error stated. RESHAPED TWICE, both times because the row was green and therefore worthless (AC-3): version 1 rewrote the CALLER to change its parameter type, which linkFiles heals by deleting every from-owned edge of a reprocessed file; version 2 moved the type change into prov/Provider.java but pointed it at a class with no matching member, so the call re-pointed to nothing and the row could not tell a correct drop from a failure to bind. alt.Alt now declares rate() as well, so this row asserts a genuine RE-POINT: the old edge must GO and the new one must ARRIVE at the confirmed tier. This is the shape the per-file stale-node purge cannot rescue - tax.rate is present in both graphs, asserted by the witness. REAL-REPO TARGET ACQUIRED 2026-08-23 BY SW-207, AND THIS ROW IS NO LONGER SKIPPED. It runs on the retrofit 2.11.0 pin at cc76c22a68e090f3dd898cbcb0bac30414f59c31, which SW-207 added to corpus/manifest.json as the only repository it examined that satisfies all five conjuncts below (SW-207's per-pin figures: retrofit 4 mixed directories of 52, 259 Java files outside them, 50 of those declaring a top-level class with a supertype, 6 named from inside a mixed directory, 6 with a usable sibling). MEASURED IN THE PUBLISHED ARTIFACTS, at the scope stated: in docs/rc/parity-matrix-jvm-sw207-run-A.json and docs/rc/parity-matrix-jvm-sw207-run-B.json (both at run sha d9361b3cf429a71ae4ef8a140e214f8514577e74) this row carries verdict PASS on all FOUR real-repo axis cells in BOTH dispatches, with full_nodes = inc_nodes, full_edges = inc_edges and snapshot_full_sha256 = snapshot_inc_sha256 in every one of the eight cell records, and the two dispatches agree cell for cell; the run reports 52 of 52 crossed rows decided, 0 SKIPPED, complete: true and publishable: true. THE TWO MEASUREMENTS THIS RETIRES KEEP THEIR SEPARATE ATTRIBUTIONS, because a retired measurement is not a deleted one. The SKIP itself was measured by SW-204: while the corpus held only okio, kotlinx.serialization and guava, all four axis cells of both dispatches reported `no JVM pin within -max-tier 3 exhibits the structure this class needs (examined: okio, kotlinx.serialization, guava)`. The per-pin census below was measured in SW-204 rebuild round 1 and is CARRIED here unchanged, not re-taken by SW-207 or by this story; it remains true of the three pins it names, and it is now a statement about three of the corpus's five JVM pins rather than about all of them. Disposition per projects/graphi/memory/decisions/2026-08-22-jvm-parity-8-skipped-cells-disposition.md, discharged by corpus acquisition (D4) exactly as D1 required and never by re-declaring this row deferred: harness_row stays required, deferred_to stays empty, and the hermetic verdict above is untouched and stays PROVEN. CORRECTED IN PLACE AND STATED, because the passage of time falsified it: this sentence read `No target for this class exists in ANY of the three pinned JVM repositories.` No target existed in any of those three, which is why the row skipped; retrofit hosts one. THE PREDICATE IS A FIVE-WAY CONJUNCTION (internal/parity/jvmclasses.go planJVMMixedDirChangeReceiverType): a directory holding Java > 0 AND Kotlin > 0 (internal/parity/jvmsource.go Mixed()), plus a Java class OUTSIDE such a directory, carrying a supertype, named by simple name from a file INSIDE one, with a swappable sibling Java class in its own directory. The planner never examines where the SUPERCLASS lives, so a cross-directory superclass is NOT one of the conjuncts. WHICH CONJUNCT FAILS, PER PIN, MEASURED 2026-08-23 at the three manifest pins by `git clone --depth 1 --branch REF --filter=blob:none --no-checkout` plus `git ls-tree -r --name-only HEAD`, with jvmsource.go jvmSkipDir's directory exclusions applied: guava 2214c636 holds 3204 .java and ZERO .kt, and kotlinx.serialization 3efe324b holds 609 .kt and 6 .java that are ALL named module-info.java - neither pin has a single mixed-language directory (0 of 130 source directories, 0 of 111), so both fail the FIRST conjunct. okio 8b870e8e SATISFIES that conjunct and is NOT a module-info case: 284 .kt beside 29 .java, NONE of them a module-info.java, in 49 source directories of which TWO are mixed - samples/src/jvmMain/java/okio/samples (16 .java + 1 .kt) and okio/jvm/jmh/src/jmh/java/com/squareup/okio/benchmarks (11 .java + 1 .kt), the second being the very directory the sibling row jvm_mixed_dir_delete_callee edits and PASSes on in all four cells of both dispatches. CORRECTION, in place and stated rather than removed silently (this note had never been published or approved): the first draft of this sentence said okio's and kotlinx.serialization's only .java files are module-info.java declarations, which is false for okio - corpus/manifest.json already recorded `284 .kt + 29 .java at the pin` and internal/parity/jvmclasses.go already said `okio is a Kotlin pin holding 29 .java files`. CORRECTED IN PLACE AND STATED: this sentence read `WHICH of okio's four remaining conjuncts fails is NOT measured and is NOT asserted here; what IS measured is that the conjunction as a whole finds no target on any of the three pins.` SW-207 measured it and the answer is conjunct (3): okio has exactly 2 Java files outside its two mixed directories and NEITHER declares a top-level class with a supertype. That is SW-207's measurement, carried here and not re-taken. WHAT THE REAL-REPO CELLS DO NOT ESTABLISH - PARITY-OBS-004, measured by the SW-207 review round 1 and published in docs/rc/parity-matrix-real-repo.md. This row is GRAPH-VACUOUS in the PARITY-VAC-001 sense, measured rather than suspected: SW-207 rebuilt the pristine tree and the mutated tree in full and found IDENTICAL nodes and edges tables, every column, at 3418 nodes / 4660 edges with binder=off and 3418 / 5431 with binder=on, and the published artifacts carry exactly those counts on the corresponding cells. The mechanism is the one already recorded for jvm_change_type_hierarchy on guava, and it is a property of the graph rather than of the pin: the JVM graph has NO edge kind for a class's `extends` supertype. Read from the code by SW-209, not from a record: engine/jvmresolve/emit.go emits a nominal `implements` edge only for a resolved supertype whose Form is FormInterface, its own doc comment says class-extends stays the syntactic extractor's `inherits` and is never confirmed here, engine/jvmresolve/emit_test.go asserts that a class-extends emits no confirmed edge, and no non-test code path in the repository mints an `inherits` edge at all - engine/link/link.go's edgeInherits constant is declared and unused and query.EdgeKindInherits is read-side only. Re-pointing an `extends` clause therefore cannot move this graph. A second, independent reason the row does not reach the D9 sweep, also SW-207's measurement: the predicate's conjunct (4) is referencesSimpleName (internal/parity/jvmsource.go), a whole-word TOKEN match with no import, package or member resolution, and on this pin the namer binds elsewhere - retrofit declares SIX distinct classes named HttpException and the namer retrofit/kotlin-test/src/test/java/retrofit2/KotlinSuspendTest.kt is in package retrofit2, imports no HttpException, and resolves its single token to retrofit2.HttpException, which SW-209 confirmed at the pinned sha is the SUPERCLASS the mutation removes from retrofit2.adapter.guava.HttpException rather than the edited class itself; SW-207 measured ZERO edges crossing between the mixed directory and the edited file at binder off or on. The predicate is UNREPAIRED here: repairing it re-bases published evidence and is PARITY-OBS-004's own work. SO, STATED AT THE SCOPE MEASURED: the four real-repo cells assert full-vs-incremental byte-identity over a real in-place edit to a real Java file that the graph does not see at all - a genuine parity statement, and never a correctness statement about any edge - and they are NOT a second proof of the ADR 0008 D9 (directory, language) sweep, which the hermetic fixture above proves and which nothing in this graph crosses a mixed directory to exercise. Publishability is unaffected: it is a property of every declared row being decided by two agreeing dispatches, not of any row being graph-non-vacuous."

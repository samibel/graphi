# SW-010 — Budget-gated benchmark manifest.
#
# Single source of truth for every benchmark budget. Baselines are version-
# stamped: an intentional, justified perf change is made by editing the baseline
# (and budget) here and bumping baseline_version — NO code change is required
# (AC: reviewer-driven baseline re-pinning). The gate fails when a measured
# metric EXCEEDS its budget and reports the delta vs the baseline.
#
# Units: *_ms in milliseconds; binary_size_bytes in bytes. All metrics use the
# "<=" comparator (measured must not exceed budget).
version: 1
# 2026-06-23-v2: re-pinned binary_size for EP-008. ...
# (previous baseline notes preserved)
#
# 2026-07-16-v050-hardening: binary_size_bytes now measures the canonical
# CGo-free release build contract (-trimpath, VCS metadata, fixed version stamp,
# and the 20 registered subset grammar tags) on go1.26.5/linux-amd64/GOAMD64=v1.
# The previous raw `go build` was source-path dependent and had drifted from the
# release command it claimed to measure. The v0.5 hardening work adds bounded
# graph reads plus root/HTTP/MCP security and grows the default binary
# intentionally; package analysis found no new external dependency or accidental
# grammar blob. Baseline 32,509,872 B is the measured canonical current tree;
# budget 34,250,000 B preserves ~5.35% headroom and remains ~15.75 MB below the
# hard 50 MB product ceiling.
# 2026-08-13-p4-incremental-suite: the P4 / TODO-19 incremental-indexing suite
# adds seven metrics over the SAME frozen fixture (mutations happen only in a
# runtime copy — fixture_digest is unchanged): ten-file incremental change,
# simulated branch switch (modify+add+delete), MCP startup over the measured
# binary (spawn → initialize response), named query latencies (symbol lookup /
# callers / task_context), and the post-GC heap after a full index. Baselines
# are the locally measured values scaled ~10x for CI-runner headroom (the
# cold_start local/CI ratio); budgets add further margin. The spawn-, sub-ms-,
# and GC-sensitive metrics start at severity warn (trend tracking without new
# flake surface); the index-bound ones gate at fail like full_index/freshness.
#
# 2026-08-24-sw194b5-ruby-pendingref: binary_size_bytes re-pinned for SW-194b.5
# (DEC-2026-08-24-binary-size-repin-sw194b5). ONLY this metric moves; the other
# 22 stay exactly as pinned above.
#
# WHAT GREW. SW-194b.5 makes Ruby emit a PendingRef for receiver-less parenless
# cross-file calls — before it, "who calls X?" was unanswerable across Ruby files
# at the heuristic tier — and gates the emission so ordinary Ruby
# (`head, *tail = list`, `in {status: status}`) stops being reported as calls it
# never made. It is a soundness fix, not a feature.
#
# BY HOW MUCH, ATTRIBUTED. Same-method cross-builds (CGO_ENABLED=0 GOOS=linux
# GOARCH=amd64 GOAMD64=v1, internal/release.CanonicalBuildArgs, the 21 registered
# subset tags, go1.26.6):
#     main                                       34,245,005
#     sw-199-w5m-intra-parse-parity-classes      34,245,005   (+0, byte-neutral)
#     sw-194b5-pendingref-emission-cross-family  34,267,179   (+22,174)
# `go tool nm -size` diffed against main finds exactly 11 new symbols totalling
# 6,373 B (map.init.1 1,936; rubyCollectScope 1,162; rubyScanUses 941;
# rubyBindPattern 633; rubyBindParams 620; rubyBindTarget 362; (*rubyScope).skip
# 301; (*rubyScope).bind 237; map.init.0 165; two 8-B map headers) — 28.7% of the
# growth. The remaining ~15.8 kB is pclntab/funcdata/type metadata and section
# alignment, which no source-level change reaches. The diff touches ONE Go file
# (core/parse/parser_ruby.go); go.mod/go.sum are unchanged (no new external
# dependency) and internal/release.DefaultGrammarSubsetTags is unchanged (no new
# grammar blob — ruby.bin has been embedded since SW-054).
#
# WHY RE-PIN RATHER THAN SHRINK. The overrun against the old budget was 17,107 B.
# The entire new-code surface is 6,373 B, so no shrink that preserves the
# soundness fix can reach 17,107 B; the only "shrink" that fits is deleting the
# fix. Converting the two package-level Ruby call-position maps to switches
# recovers ~2 kB — an eighth of the gap.
#
# WHY THE OLD BUDGET HAD STOPPED DISCRIMINATING. At 34,250,000 B, plain `main`
# measured 34,245,005 — 4,995 B of headroom, 0.0146%. bench/lang-budget.md's
# SW-177 amendment measured the go1.26.5 → go1.26.6 bump alone at +8,854 B on an
# unchanged tree: the old budget would have failed on a toolchain patch release
# with no code change at all. SW-203 measured the same 0.0147% and filed a
# follow-up predicting the next language change would breach it. A gate that
# fires on compiler noise no longer separates justified growth from unjustified
# growth, so re-pinning restores the discipline rather than relaxing it.
#
# THIS IS NOT THE SIN SW-177/SW-203 REFUSED. Those refusals are about
# bench/lang-budget.md, the per-language ATTRIBUTION ledger, where widening an
# allocation to fit a measurement destroys the accounting (SW-177 published
# Kotlin's 385,418 B marginal cost and moved nothing; SW-203 reported yaml's
# 6.03x overrun rather than absorbing it). bench-budget.yml is the CI GATE, and
# its own header (lines 3-7) states the sanctioned way to move it: edit baseline
# and budget, bump baseline_version, no code change. The two artifacts have
# different rules on purpose — attribute honestly in the ledger, move the gate
# deliberately with the attribution attached. lang-budget.md is NOT widened here.
#
# THE NEW NUMBERS. Baseline 34,267,107 B is the CI-measured canonical release
# build of the integration branch (the artifact this gate actually produces; the
# darwin/arm64 cross-build above reads 34,267,179 B, a +72 B host-method delta,
# and every figure quoted here is a same-method delta). Budget 36,100,000 B
# preserves 1,832,893 B = 5.35% headroom over that baseline, matching the
# 2026-07-16-v050-hardening precedent (5.35%) exactly, and sits 13,900,000 B
# (13.90 MB) below the hard < 50 MB whole-binary product ceiling
# (docs/adr/0001-parser-tier1-and-sizing.md:22) — 72.2% of it. The restored
# headroom still catches every regression class this gate exists for: a stray
# grammar blob is 119-337 kB and the untagged all-206 embed is +24.5 MiB. Fine-
# grained per-language drift is the ledger's job, not this gate's.
#
# NOTHING ELSE IS ARMED. In the same failing run, binary_size_bytes was the only
# entry in gate.failed; the next-tightest metric is fast_db_size_bytes at 94,208
# of 200,000 (47.1% of budget) and every other metric measures below 30% of its
# budget. No second tripwire is left cocked by this re-pin. (Separately, several
# *_ms baselines now sit 10-30x above measured — a stale-baseline reporting
# problem, not a gate failure, and deliberately left for the owner.)
#
# 2026-08-28-sw243-baseline-decision: baseline re-pinned to today's measured
# `main`; the BUDGET IS DELIBERATELY NOT MOVED. Only binary_size_bytes' baseline
# changes; every budget in this file, including this metric's, stays exactly as
# pinned above.
#
# THE MEASUREMENT (SW-243 AC-1). Canonical release shape, measured — not carried
# over from the backlog entry that opened this story:
#
#     CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
#       go build -trimpath -buildvcs=true \
#         -tags "$(internal/release.DefaultGrammarSubsetTags, all 21)" \
#         -ldflags "-X github.com/samibel/graphi/internal/version.Version=dev" \
#         -o /tmp/graphi ./cmd/graphi/
#
# run from a CLEAN checkout of `main` @ ebe0e87 on go1.26.6/darwin-arm64:
# 35,351,306 B, sha256 424e270d4efa1616a6fc9f1c2ec34ec5e887bfa744d888513aa1df0f
# c58ac7e4, byte-identical on a second build. Against the unchanged 36,100,000 B
# budget that is 748,694 B of headroom — 2.07% of the budget, 2.12% of the
# measured size. Drift since the 2026-08-24 pin: +1,084,199 B (+3.16%).
#
# THE METHOD IS EXACT, AND THE PREVIOUS NOTE'S "+72 B HOST-METHOD DELTA" WAS NOT
# A HOST DELTA. The same command at a2ae62c — the commit carrying SW-194b.5 —
# reproduces the CI-pinned 34,267,107 B EXACTLY, to the byte, cross-built from
# darwin/arm64. So this gate's number IS reproducible off-CI and no host
# correction is needed. What produced the 72 B was measuring inside a LINKED GIT
# WORKTREE: Go's VCS stamping requires `.git` to be a DIRECTORY, so `git worktree`
# checkouts silently drop `-buildvcs=true` (no error, no warning) and build an
# unstamped, differently-sized binary — 34,267,179 B there against 34,267,107 B
# here at the same commit, and 35,347,282 B against 35,351,306 B at ebe0e87. The
# delta is not a constant and must not be applied as one. MEASURE FROM THE REAL
# REPOSITORY WORKING DIRECTORY, NOT FROM A `git worktree` CHECKOUT.
#
# WHAT GREW, ATTRIBUTED. Same-method ladder on `main`'s first-parent line:
#     a2ae62c  SW-194b.5 (the pinned baseline)      34,267,107
#     4990599  SW-229 declarative rule packs        35,122,398   (+855,291)
#     710c90e  SW-230 dev kit / SW-231 spike        35,247,321   (+124,923)
#     1624de2  SW-228 bulk read-only migration      35,276,703   (+29,382)
#     ebe0e87  SW-232/239/240/241                   35,351,306   (+74,603)
# `go tool nm -size` rolled up by package, a2ae62c → ebe0e87, largest first:
# gopkg.in/yaml.v3 +142,864 (newly LINKED, not newly depended on); engine/opcatalog
# +95,244 (new); engine/extpack +93,749 (new); go:func metadata +50,312; main
# +28,951; surfaces/client +23,546; internal/divergence +16,462 (new);
# engine/module +15,954 (new); engine/extpack/conformance +14,529 (new);
# engine/analysis/taint +11,871; text/tabwriter +7,795 (newly linked);
# surfaces/http +6,583; cmd/internal/runtime +6,001; engine/agenttools/archintel
# +4,827; core/registry +4,570 (new). Symbol bytes account for +542,679 of the
# +1,084,199; the remainder is pclntab/funcdata/type metadata and section
# alignment, which no source-level change reaches. This is the AX extension
# platform kernel (SW-220..232), and it is one subsystem, not scattered bloat.
# `git diff a2ae62c ebe0e87 -- go.mod go.sum internal/release/build.go` is EMPTY:
# no new external dependency, no new grammar blob. yaml.v3 and text/tabwriter were
# already in the module graph and are newly reachable from the shipped binary.
#
# WHY RE-BASELINE. The baseline is the REPORTING number — the gate prints the
# delta against it — and it had drifted 1,084,199 B stale, so every green run was
# reporting a delta that was wrong by 3.16%. Re-pinning it costs nothing in
# enforcement and restores an honest report. This is the sanctioned mechanism this
# file's own header (lines 3-7) describes.
#
# WHY THE BUDGET DOES NOT MOVE — THE MEASURED ANSWER, NOT THE COMFORTABLE ONE.
# The story that opened this decision assumed thin headroom meant a raise. It does
# not, because the work queued behind this gate was sized rather than guessed:
#   * SW-244 flips the canary default legacy → shadow. That is a default value; the
#     dual-run executor path has been linked since SW-226. New linked code: none.
#   * SW-238 migrates the ~11 read-only Stable operations onto the executor. Its
#     closest measured analogue is SW-228, which migrated 8-12 read-only Labs ops
#     by the same recipe for a NET +29,382 B — net of the manual dispatch arms it
#     deleted. At that rate SW-238 costs roughly 30-45 kB; call it 50 kB with
#     metadata slack. That is 6.7% of the 748,694 B available.
# Raising the budget now would be raising it because it COULD be raised, not
# because anything needs it. A budget that moves without a forcing measurement is
# not a budget.
#
# THIS IS NOT THE 2026-08-24 SITUATION. That raise was justified because headroom
# (4,995 B, 0.0146%) had fallen BELOW the noise floor: bench/lang-budget.md's
# SW-177 amendment measured the go1.26.5 → go1.26.6 bump alone at +8,854 B on an
# unchanged tree, so the gate would have failed on a toolchain patch release with
# no code change. Today's 748,694 B is 84.6x that event. The gate still
# discriminates, so the condition that justified moving it is absent.
#
# THE CEILING, AND WHAT WOULD MAKE ME REFUSE TO MOVE IT AGAIN (SW-243 AC-3). The
# ceiling is the budget itself: 36,100,000 B, unchanged, 13,900,000 B below the
# < 50 MB hard product ceiling of docs/adr/0001-parser-tier1-and-sizing.md:22. It
# is defensible because it is not a physical limit but a self-imposed ratchet, and
# a ratchet is only worth anything while it ratchets. Four standing refusals, so
# the next person cannot move it by feel:
#   R1. REFUSE any raise whose growth is not ATTRIBUTED to the same standard used
#       here: a same-method before/after build from a real repository checkout, a
#       `go tool nm -size` rollup naming the packages that grew, and a `go.mod` /
#       `go.sum` / grammar-tag diff proving no new external dependency and no new
#       grammar blob.
#   R2. REFUSE a raise caused by a newly LINKED existing dependency until that
#       link is shown to be needed on the shipped DEFAULT path. Today's drift
#       contains exactly one such case — yaml.v3, 142,864 B, 13.2% of the drift,
#       pulled in by the extension-pack manifest readers — and it is accepted here
#       only because the extension kernel is a shipped default capability.
#   R3. REFUSE a raise while headroom still exceeds 10x the largest measured
#       toolchain-noise event (currently 88,540 B). Below that line the gate has
#       stopped separating justified growth from compiler noise and a raise is the
#       honest move; above it, a raise is just relief. This is the 2026-08-24
#       argument restated as a threshold instead of a judgement call.
#   R4. REFUSE any budget above 40,000,000 B — 80% of the hard ceiling — without a
#       new ADR amending ADR 0001's sizing model. Past that point "13.9 MB below
#       the ceiling" has stopped being an answer.
# By R3, the next legitimate raise conversation starts when a measured `main` is
# within ~88.5 kB of 36,100,000 B, i.e. at about 36,011,000 B. That is 660 kB of
# growth away, and SW-244 plus SW-238 are projected to spend under 8% of it.
#
# NOTHING ELSE MOVES. binary_size_bytes' baseline is the only value edited. No
# metric is added, removed, re-severitied or soft-failed; binary_size_bytes carries
# no `severity` key and therefore still gates at `fail` (internal/bench/budget.go
# :186,191). bench/lang-budget.md, the per-language attribution ledger, is NOT
# touched — the SW-177/SW-203 refusals stand.

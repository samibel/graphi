# SW-123 (EVAL-02): full evaluation runs over the pinned real repositories.
#
# Per repo (matrix job, ONE repo per process so peak RSS is attributable):
# shallow-clone at the pinned ref (fail-closed SHA verification), cold full
# index (wallclock, peak RSS, DB size), warm per-op-class p95 over the same
# in-process session — raw evidence as internal/evalreport JSON artifacts.
# Plus the 20-task hero suite (SW-122) over the hermetic tier-1 fixtures.
#
# ubuntu-latest is the REFERENCE RUNNER CLASS (docs/eval/hero-protocol.md):
# only numbers recorded here freeze the ADR 0003 U5 budgets. Procedure after
# a green run: download the artifacts, commit them under
# docs/eval/runs/<date>-ubuntu-latest/, and fill the null budgets in
# docs/eval/hero-budgets.json as ratchets in the same reviewed PR, citing
# this workflow run.
#
# DELIBERATELY a separate workflow (like corpus.yml): it clones public
# repositories, so it needs the network and never joins the zero-egress
# canary posture. Scheduled weekly + manual dispatch; not a PR gate — the
# hero suite's PR gate is cmd/eval/hero_test.go inside testgate.
name: eval-full

on:
  schedule:
    # Weekly, Monday 04:00 UTC — after the nightly corpus run has verified
    # the pins, before the work week consumes the numbers.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  full-run:
    name: full run over ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the EVAL-02 selection in docs/eval/hero-budgets.json:
        # Go (typeresolve acceptance target), Python, Java/JVM monorepo.
        #
        # The v3 Go corpus (uuid, lo, gin, grpc-go, and the kubernetes stress
        # target) is deliberately NOT here: -budgets is fail-closed, so a repo
        # missing from hero-budgets.json's real_repos.selection fails the run,
        # and those budgets are historical ceilings from a retired harness.
        # SW-123 named the runner class and the reference scenario
        # (docs/eval/reference-scenario.json, grpc-go on ubuntu-latest) and
        # marked the budgets historical/non-ratcheting.
        #
        # SW-124 measures the reference scenario in the separate
        # `cold-index-series` job below, WITHOUT -budgets: it is read against
        # the contract's PRD §12.2 gates, not against retired ceilings.
        # Re-baselining hero-budgets.json still waits for a candidate (SW-121)
        # and a published baseline (SW-130). This job stays SINGLE-RUN, and a
        # guard test asserts the repetition flag never appears in it.
        repo: [cobra, flask, guava]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # SW-123: validate the measurement contract BEFORE measuring anything —
      # a contract that no longer matches the pinned corpus would otherwise be
      # discovered after a 30-minute guava job.
      - name: check the reference-scenario contract
        run: go run ./cmd/eval -check-reference-scenario
      - name: full measurement run (${{ matrix.repo }})
        run: |
          go run ./cmd/eval \
            -manifest corpus/manifest.json \
            -full-run "${{ matrix.repo }}" \
            -runner-class ubuntu-latest \
            -budgets docs/eval/hero-budgets.json \
            -reference-scenario docs/eval/reference-scenario.json \
            -out "eval-full-${{ matrix.repo }}.json"
      # The raw report also goes to the job log (and step summary): the run
      # page is then self-documenting, and the evidence stays retrievable via
      # the logs API even where artifact-storage domains are unreachable.
      - name: print raw evidence
        if: always()
        run: |
          echo "=== EVAL-FULL-REPORT-BEGIN ${{ matrix.repo }} ==="
          cat "eval-full-${{ matrix.repo }}.json"
          echo "=== EVAL-FULL-REPORT-END ${{ matrix.repo }} ==="
          { echo '```json'; cat "eval-full-${{ matrix.repo }}.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: upload raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-full-${{ matrix.repo }}
          path: eval-full-${{ matrix.repo }}.json

  # SW-124 (P0-C1): FR-8's repeated cold-index measurement over THE reference
  # scenario. Ten cold runs, one process per run (getrusage MAXRSS is a
  # process-lifetime peak, so in-process repetition would republish run 1's
  # peak), reported as p50 AND p95 with every sample kept in the artifact.
  #
  # Deliberately separate from the matrix job above: that one enforces the
  # historical per-repo ceilings for cobra/flask/guava and stays single-run,
  # while this one is read against the PRD §12.2 gates in
  # docs/eval/reference-scenario.json and passes no -budgets (grpc-go has no
  # budget entry, and -budgets is fail-closed).
  #
  # A gate here reads UNKNOWN — never PASS — unless the run is the reference
  # scenario on the reference class, from the frozen candidate, with all ten
  # runs completed. That is expected to be the state until SW-121 re-freezes
  # the candidate, and it is visible in the artifact rather than assumed away.
  cold-index-series:
    name: cold-index series (reference scenario, 10 runs)
    runs-on: ubuntu-latest
    # Ten cold indexes plus a clone each, plus the constrained OOM run. The
    # matrix job's 45 minutes is per single run; this is an order of magnitude
    # more work.
    timeout-minutes: 180
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: check the reference-scenario contract
        run: go run ./cmd/eval -check-reference-scenario
      # Built once, deliberately: -cold-runs re-invokes this same binary per
      # run, so building here keeps compilation out of every measured window
      # and puts one auditable executable in the run record.
      - name: build the eval harness
        run: go build -o ./bin/eval ./cmd/eval
      - name: ten cold runs over the reference scenario
        run: |
          ./bin/eval \
            -manifest corpus/manifest.json \
            -full-run grpc-go \
            -cold-runs 10 \
            -drop-caches \
            -oom-check \
            -runner-class ubuntu-latest \
            -reference-scenario docs/eval/reference-scenario.json \
            -candidate docs/rc/evidence-index.yaml \
            -workdir "${RUNNER_TEMP}/cold-series" \
            -out eval-cold-grpc-go.json
      - name: print raw evidence
        if: always()
        run: |
          echo "=== EVAL-COLD-SERIES-BEGIN grpc-go ==="
          cat eval-cold-grpc-go.json
          echo "=== EVAL-COLD-SERIES-END grpc-go ==="
          { echo '```json'; cat eval-cold-grpc-go.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: upload raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-cold-grpc-go
          path: eval-cold-grpc-go.json

  hero-suite:
    name: hero suite (20 tasks, tier-1 fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run the hero suite
        run: |
          go run ./cmd/eval \
            -manifest corpus/manifest.json \
            -scenarios corpus/hero \
            -out hero-report.json \
            -format markdown
      - name: print raw evidence
        if: always()
        run: |
          echo "=== HERO-REPORT-BEGIN ==="
          cat hero-report.json
          echo "=== HERO-REPORT-END ==="
      - name: upload hero report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hero-report
          path: |
            hero-report.json
            hero-report.md

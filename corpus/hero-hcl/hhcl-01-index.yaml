id: hhcl-01-index
description: >
  Indexing the hcl fixture returns a populated inventory: every checked-in
  hcl source file is walked and every declaration the hcl node set admits
  is minted, so infra/main.tf is present in the answer. This is the positive control
  the abstention scenarios in this suite lean on — if the fixture were not
  really indexed, this scenario is the one that goes red first.
fixture_ref: tier1-fixture-hero-hcl
operation:
  name: index
area: agent_mcp
expect:
  outcome: found
  contains_path: infra/main.tf

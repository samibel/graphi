    real_repo_binder: "off+on"
    harness_row: "required"
    known_defect: ""
    deferred_to: ""
    owner: "WP-J5c"
    note: "An explicit `import c.Model` is added to a caller that already had `import b.*`, so Model re-resolves from b.Model to c.Model (JLS 6.4.1: single-type imports shadow on-demand) and use's confirmed call re-points b.run -> c.run. Proves the resolver's import-precedence ladder (resolve.go). Witness requires the b.run edge absent and the c.run edge confirmed. REAL-REPO TARGET ACQUIRED 2026-08-23 BY SW-207, AND THIS ROW IS NO LONGER SKIPPED. It runs on the antlr4 4.13.1 pin at 7ed420ff2c78d62883875c442d75f32e73bc86c8, which SW-207 added to corpus/manifest.json because it was the only pin examined that carries a NON-STATIC Java on-demand import (SW-207's per-pin count of import STATEMENTS: antlr4 75 on-demand, 17 static, 58 non-static; guava 1/1/0; okio, kotlinx.serialization and retrofit 0/0/0). MEASURED IN THE PUBLISHED ARTIFACTS, at the scope stated: in docs/rc/parity-matrix-jvm-sw207-run-A.json and docs/rc/parity-matrix-jvm-sw207-run-B.json (both at run sha d9361b3cf429a71ae4ef8a140e214f8514577e74) this row carries verdict PASS on all FOUR real-repo axis cells in BOTH dispatches, with full_nodes = inc_nodes, full_edges = inc_edges and snapshot_full_sha256 = snapshot_inc_sha256 in every one of the eight cell records, and the two dispatches agree cell for cell; the run reports 52 of 52 crossed rows decided, 0 SKIPPED, complete: true and publishable: true. THE TWO MEASUREMENTS THIS RETIRES KEEP THEIR SEPARATE ATTRIBUTIONS, because a retired measurement is not a deleted one. The SKIP was measured by SW-204: while the corpus held only okio, kotlinx.serialization and guava, all four axis cells of both dispatches reported `no JVM pin within -max-tier 3 exhibits the structure this class needs (examined: okio, kotlinx.serialization, guava)`. The CAUSE was measured by SW-176 and is still CARRIED here verbatim, never re-taken by SW-204, by SW-207 or by this story: its recorded measurement, in planJVMChangeImportShadowing's own comment in internal/parity/jvmclasses.go, is that the only Java wildcard import across guava, okio and kotlinx.serialization was guava's `import static java.util.stream.Collectors.*;`, a STATIC on-demand import that imports members rather than types and that JLS 6.4.1's single-type-import rule does not govern, which internal/parity/jvmclasses.go refused deliberately rather than run the row under the wrong semantics. Disposition per projects/graphi/memory/decisions/2026-08-22-jvm-parity-8-skipped-cells-disposition.md, discharged by corpus acquisition (D4) exactly as D1 required and never by re-declaring this row deferred: harness_row stays required, deferred_to stays empty, and the hermetic verdict above is untouched and stays PROVEN. WHAT THE REAL-REPO CELLS DO NOT ESTABLISH - PARITY-OBS-004, measured by the SW-207 review round 1 and published in docs/rc/parity-matrix-real-repo.md. This row is NOT graph-vacuous, and SW-207 measured the difference: the mutation adds exactly ONE edge, file CustomDescriptors.java --imports (heuristic, 0.6)--> package org.antlr.v4.codegen.model, 31285 edges before against 31286 after at binder=on / profile=default (the published artifacts record only the post-mutation side of that pair, 11069 nodes / 31286 edges, so the pristine 31285 is SW-207's diagnostic rebuild and not a figure this file reads out of a report). But the JLS 6.4.1 ladder is NOT exercised on the real target and the harness's own mutation sentence `so Lexer re-resolves` is unestablished: re-verified at the pinned sha by SW-209, all FOUR `Lexer` tokens in runtime-testsuite/test/org/antlr/v4/test/runtime/CustomDescriptors.java are `GrammarType.Lexer` qualified member selects rather than type references, and the file's only non-static on-demand import is `java.util.*`, which declares no Lexer. The reason is the predicate, which is UNREPAIRED: selection is referencesSimpleName (internal/parity/jvmsource.go), a whole-word TOKEN match over comment- and string-masked bytes with no import, package or member resolution, so a selected target need not exercise the rule this row asserts. Repairing it re-bases published evidence and is PARITY-OBS-004's own work, not this note's. SO, STATED AT THE SCOPE MEASURED: the four real-repo cells assert full-vs-incremental byte-identity over a real in-place Java edit worth exactly one imports edge - a genuine parity statement, and never a correctness statement about any edge - while the import-precedence ladder described at the top of this note is proven by the HERMETIC row alone."


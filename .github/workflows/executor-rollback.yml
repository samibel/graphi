# SW-232 (AX-12a) AC-5 — the executor-seam rollback, exercised.
#
# docs/executor-seam-rollback.md tells an operator how to force the AX-06/AX-08
# executor seam back to `legacy`, how to check that it took, and how to return
# to the shipped configuration. A documented rollback that nobody runs is a
# claim, not a capability: this workflow runs the page's procedure on every pull
# request, so a rollback that stopped working fails CI instead of failing an
# operator mid-incident.
#
# The three legs mirror the page:
#
#   force     — GRAPHI_CANARY_ALL=legacy, then the parity and characterization
#               suites in that position. They are the suites that would notice
#               if the forced position changed an answer.
#   read      — the divergence record read WITHOUT starting a server, asserted
#               to report UNKNOWN on a fresh state directory (SW-232 AC-3) —
#               absence of evidence must not render as evidence of parity.
#   round-trip — the variable is removed and every operation must return to the
#               compiled-in default. Half a rollback is the failure mode that
#               strands an install in a position nobody chose.
#
# SW-244 moved the shipped default from `legacy` to `shadow`, and this workflow
# is AC-4's evidence that the rollback still works against it. Two legs had to
# change and neither weakened:
#
#   * the round-trip now asserts `11 shadow` and `shadow (compiled-in default)`,
#     because that is what the shipped configuration now is. Asserting `10
#     legacy` after the flip would have been asserting that the rollback FAILED
#     to round-trip.
#   * a fourth leg was added: with NO variable set, a real dispatch must leave
#     an observation in the divergence record. That is the property the flip
#     exists to buy, and leg 2 (fresh state directory reads UNKNOWN) cannot
#     show it — the two legs are the same read path on opposite inputs.
name: executor-rollback

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  executor-seam-rollback:
    name: executor-seam-rollback
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build the binary the rollback is exercised against
        run: go build -o "$RUNNER_TEMP/graphi" ./cmd/graphi/

      # LEG 1 — force the kill switch to legacy and run the suites in that
      # position. ./surfaces is where the cross-surface parity tests and the
      # characterization goldens live; ./surfaces/client owns the seam itself;
      # engine/conformance is the full-vs-incremental determinism matrix; and
      # ./internal/parity is the hermetic FR-7 harness (the real-repo matrix is
      # a dispatch-only workflow and deliberately not a PR gate).
      - name: force legacy — parity + characterization suites
        env:
          GRAPHI_CANARY_ALL: "legacy"
        run: |
          go test ./surfaces/ ./surfaces/client/ ./engine/conformance/ ./internal/parity/ -count=1
          go test ./surfaces/ -run 'Parity|Characterization|AX0' -count=1

      # LEG 1b — the same suites with the switch set per operation rather than
      # by the whole-seam variable, because that is the form the page tells an
      # operator to reach for when rolling ONE operation back.
      - name: force legacy per operation — the seam's own suites
        env:
          GRAPHI_CANARY_DEAD_CODE: "legacy"
          GRAPHI_CANARY_COMPOUND: "legacy"
        run: go test ./surfaces/client/ ./cmd/internal/runtime/ -count=1

      # LEG 2 — the read path, without a server. A fresh state directory has no
      # observation in it, so the honest answer is UNKNOWN. A run that printed
      # a zero-divergence verdict here would be the false green this story
      # exists to remove, so the assertion is on the WORD.
      - name: divergence record reads UNKNOWN, not zero divergences
        env:
          GRAPHI_CANARY_ALL: "legacy"
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state-empty"
          mkdir -p "$XDG_STATE_HOME"
          "$RUNNER_TEMP/graphi" doctor -divergence --json > "$RUNNER_TEMP/divergence.json"
          cat "$RUNNER_TEMP/divergence.json"
          state=$(jq -r '.state' < "$RUNNER_TEMP/divergence.json")
          # SW-248 sharpened this verdict and did not relax it. The default MCP
          # profile advertises none of the migrated operations, so an empty
          # record here is not merely empty — it cannot fill for a client bound
          # to the shipped default, and the document now says which of the two
          # it is. Both spellings begin with UNKNOWN and neither may ever be a
          # statement of parity, which is what the assertion is on.
          case "$state" in
            UNKNOWN|UNKNOWN-AND-UNOBSERVABLE) ;;
            *)
              echo "::error::an unobserved seam reported state=$state; it must report UNKNOWN"
              exit 1
              ;;
          esac
          unknown=$(jq '[.operations[] | select(.state != "UNKNOWN")] | length' < "$RUNNER_TEMP/divergence.json")
          if [ "$unknown" != "0" ]; then
            echo "::error::an unobserved operation reported a state other than UNKNOWN"
            exit 1
          fi
          "$RUNNER_TEMP/graphi" doctor -divergence | tee "$RUNNER_TEMP/divergence.txt"
          grep -q 'NOT' "$RUNNER_TEMP/divergence.txt"

          # SW-248 AC-3/AC-4: the readout must say WHY it is empty. On this
          # binary every migrated operation is Labs and the default profile is
          # Stable, so the honest reading is "not possible here", and an output
          # that stopped at "no observation has been recorded" would be the
          # defect this story closed coming back.
          grep -q 'THIS RECORD CANNOT FILL' "$RUNNER_TEMP/divergence.txt"
          grep -q 'NOT OBSERVABLE through' "$RUNNER_TEMP/divergence.txt"
          if grep -q 'NOT YET OBSERVED, but reachable' "$RUNNER_TEMP/divergence.txt"; then
            echo "::error::an operation no shipped default profile advertises is filed as merely not-yet-observed"
            exit 1
          fi
          reachable=$(jq -r '.reachable_in_default' < "$RUNNER_TEMP/divergence.json")
          evaluated=$(jq -r '.reach_evaluated' < "$RUNNER_TEMP/divergence.json")
          if [ "$evaluated" != "true" ]; then
            echo "::error::the divergence document did not evaluate reachability at all"
            exit 1
          fi
          if [ "$reachable" != "0" ]; then
            echo "::error::reachable_in_default=$reachable — the default profile now advertises a migrated operation; that is a tier move and needs a decision, not a green run"
            exit 1
          fi

      # LEG 3 — the round-trip. With no GRAPHI_CANARY_* variable set, every
      # operation must read `legacy (compiled-in default)`: the rollback
      # returned the install to the shipped configuration, not to a pinned one
      # that merely behaves like it.
      - name: round-trip — unsetting returns every operation to the default
        run: |
          for var in $(env | grep -o '^GRAPHI_CANARY_[A-Z_]*' || true); do unset "$var"; done
          export XDG_STATE_HOME="$RUNNER_TEMP/state-roundtrip"
          mkdir -p "$XDG_STATE_HOME"
          # `graphi doctor` exits non-zero on any unrelated finding (no MCP
          # client registered on a CI runner, for one), so the verdict is read
          # from the DOCUMENT, not from the exit status.
          set +e
          "$RUNNER_TEMP/graphi" doctor --json > "$RUNNER_TEMP/doctor.json"
          set -e
          jq -e -r '.checks[] | select(.id=="executor-seam") | .message' \
            < "$RUNNER_TEMP/doctor.json" | tee "$RUNNER_TEMP/seam-message.txt"
          grep -q '0 legacy, 11 shadow, 0 active' "$RUNNER_TEMP/seam-message.txt"
          jq -e -r '.checks[] | select(.id=="executor-seam") | .detail' \
            < "$RUNNER_TEMP/doctor.json" > "$RUNNER_TEMP/seam-detail.txt"
          cat "$RUNNER_TEMP/seam-detail.txt"
          defaults=$(grep -c 'shadow (compiled-in default)' "$RUNNER_TEMP/seam-detail.txt" || true)
          pinned=$(grep -c '(GRAPHI_CANARY_' "$RUNNER_TEMP/seam-detail.txt" || true)
          if [ "$defaults" != "11" ] || [ "$pinned" != "0" ]; then
            echo "::error::round-trip failed: $defaults operation(s) on the compiled-in default, $pinned still pinned by a variable"
            exit 1
          fi
          go test ./cmd/internal/runtime/ -run 'Canary|SW232' -count=1

      # LEG 4 (SW-244 AC-5) — the flip, end to end through the REAL binary.
      #
      # With NO kill-switch variable set, a session on the shipped default must
      # actually FILL the divergence record: a fresh `graphi doctor -divergence`
      # process, started after the server has exited, has to report observations
      # rather than UNKNOWN. This is the property the whole flip exists to buy,
      # and leg 2 cannot show it — leg 2 is the same read path on the opposite
      # input, and both are needed: one proves the record does not lie when
      # nothing was seen, this one proves it fills when something was.
      #
      # It goes through `graphi mcp` and not `graphi dead-code` because the seam
      # is on the MCP and HTTP surfaces only; the CLI verbs call the legacy
      # client methods directly and are not part of AX-06/AX-08's scope. A CLI
      # workload here would pass while proving nothing.
      #
      # `-labs` is required and is itself evidence for AC-6: the migrated
      # operations are Labs, the default MCP profile is Stable, and this story
      # did not move one into the other.
      - name: shipped default fills the divergence record
        run: |
          for var in $(env | grep -o '^GRAPHI_CANARY_[A-Z_]*' || true); do unset "$var"; done
          export XDG_STATE_HOME="$RUNNER_TEMP/state-shadow"
          mkdir -p "$XDG_STATE_HOME"

          # A tiny hermetic repo, so the leg indexes two files instead of the
          # whole checkout and its result does not move with the codebase.
          fixture="$RUNNER_TEMP/seam-fixture"
          mkdir -p "$fixture"
          cd "$fixture"
          printf 'module example.com/seamfixture\n\ngo 1.22\n' > go.mod
          printf 'package main\n\nimport "fmt"\n\nfunc Used() string { return "used" }\n\nfunc Unused() string { return "nobody calls me" }\n\nfunc main() { fmt.Println(Used()) }\n' > main.go
          git init -q .
          git -c user.email=ci@example.com -c user.name=ci add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm fixture

          # Three migrated operations, one MCP SESSION EACH — which is both the
          # stronger assertion and the realistic shape. A store flushes its
          # first observation immediately and then coalesces for two seconds
          # (internal/divergence, defaultFlushInterval), so three calls fired
          # into one short-lived session would legitimately persist as one
          # observation and prove less than it looks like. Three sessions write
          # three segments, which is also what a release line actually
          # accumulates: many server processes, each leaving its own record.
          for op in dead_code repo_overview architecture; do
            {
              printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"executor-rollback","version":"1"}}}'
              printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
              printf '{"jsonrpc":"2.0","id":10,"method":"tools/call","params":{"name":"%s","arguments":{}}}\n' "$op"
            } > "calls-$op.jsonl"
            "$RUNNER_TEMP/graphi" mcp -labs < "calls-$op.jsonl" > "mcp-$op.out" 2> "mcp-$op.err" || true
            cat "mcp-$op.err"
            if ! jq -e -s '[.[] | select(.id == 10 and .result != null)] | length == 1' < "mcp-$op.out" > /dev/null; then
              echo "::error::$op failed over MCP; the seam was not exercised"
              cat "mcp-$op.out"
              exit 1
            fi
          done

          # The server has exited. A DIFFERENT, short-lived process reads the
          # record — which is the capability SW-232 added and the precondition
          # SW-228 named for moving the default back to `shadow`.
          "$RUNNER_TEMP/graphi" doctor -divergence --json > "$RUNNER_TEMP/divergence-shadow.json"
          cat "$RUNNER_TEMP/divergence-shadow.json"
          state=$(jq -r '.state' < "$RUNNER_TEMP/divergence-shadow.json")
          if [ "$state" = "UNKNOWN" ]; then
            echo "::error::the shipped default recorded NOTHING; a release cut from here would accrue zero shadow evidence"
            exit 1
          fi
          observed=$(jq '[.operations[] | select(.observations > 0)] | length' < "$RUNNER_TEMP/divergence-shadow.json")
          if [ "$observed" -lt 3 ]; then
            echo "::error::only $observed migrated operation(s) were observed; 3 were called"
            exit 1
          fi
          mismatches=$(jq -r '.mismatches' < "$RUNNER_TEMP/divergence-shadow.json")
          if [ "$mismatches" != "0" ]; then
            echo "::error::the two paths DIVERGED on the shipped default ($mismatches mismatch(es))"
            exit 1
          fi

          # SW-245 AC-4: since the comparison is deferred onto a bounded queue,
          # an observation count alone is no longer a coverage claim. Three
          # sequential calls on an idle runner must lose NOTHING — and, more to
          # the point, the record must SAY so rather than leave it inferred. A
          # non-zero skip here would mean either the queue is far smaller than it
          # should be or a session is exiting without draining, and both are
          # findings, not noise.
          dispatches=$(jq -r '.dispatches' < "$RUNNER_TEMP/divergence-shadow.json")
          skipped=$(jq -r '.skipped' < "$RUNNER_TEMP/divergence-shadow.json")
          coverage=$(jq -r '.coverage' < "$RUNNER_TEMP/divergence-shadow.json")
          if [ "$skipped" != "0" ] || [ "$coverage" != "1" ]; then
            echo "::error::three sequential calls lost $skipped of $dispatches comparison(s) (coverage $coverage)"
            jq -r '.skip_reasons' < "$RUNNER_TEMP/divergence-shadow.json"
            exit 1
          fi
          if [ "$dispatches" -lt 3 ]; then
            echo "::error::the record accounts for only $dispatches dispatch(es); 3 were made"
            exit 1
          fi

          "$RUNNER_TEMP/graphi" doctor -divergence | tee "$RUNNER_TEMP/divergence-shadow.txt"
          # The human readout has to carry the coverage statement too: --json is
          # what a machine reads, and this is what an operator reads.
          grep -q 'coverage:' "$RUNNER_TEMP/divergence-shadow.txt"
          grep -q 'no sampling, nothing dropped' "$RUNNER_TEMP/divergence-shadow.txt"

          # And the in-process guards for the same properties, so a regression
          # fails a unit run too rather than only this leg. SW-245's cases cover
          # the half this leg cannot reach on an idle runner: a session that ends
          # with a comparison still queued.
          cd "$GITHUB_WORKSPACE"
          go test ./cmd/internal/runtime/ -run 'TestSW244|TestSW245' -count=1 -v

      # LEG 5 (SW-248 AC-5) — the reachability gate, and the proof that it bites.
      #
      # The defect this closes existed because nothing asked, at merge time,
      # whether an operation put on the executor seam could be reached by any
      # profile the binary actually ships. SW-228 migrated Labs operations
      # (correct — Stable is frozen) and SW-244 made `shadow` the default
      # (correct — the record had become readable), and between the two correct
      # stories ten operations began dual-running where no stock client could
      # call them. Both reviews passed. This is the question, asked
      # mechanically.
      #
      # The leg has two halves and the second is the one that matters. A gate
      # nobody has watched fail is a claim about a gate, so the same binary is
      # run again with a deliberately introduced violation — an operation in
      # `shadow` that no shipped profile advertises — and it MUST exit non-zero.
      # A green first half alone would be indistinguishable from a gate that
      # cannot fail.
      - name: seam reachability — the gate, and the gate failing
        run: |
          go run ./cmd/seamreach -check | tee "$RUNNER_TEMP/seamreach.txt"
          grep -q 'seam-reachability check PASS' "$RUNNER_TEMP/seamreach.txt"

          set +e
          go run ./cmd/seamreach -check -inject-unreachable ci_injected_unreachable_op \
            > "$RUNNER_TEMP/seamreach-injected.txt" 2>&1
          injected_status=$?
          set -e
          cat "$RUNNER_TEMP/seamreach-injected.txt"
          if [ "$injected_status" -eq 0 ]; then
            echo "::error::the reachability gate PASSED a shadow-mode operation no shipped profile reaches; it would not catch the migration it exists to catch"
            exit 1
          fi
          grep -q 'seam-reachability check FAILED' "$RUNNER_TEMP/seamreach-injected.txt"
          grep -q 'ci_injected_unreachable_op' "$RUNNER_TEMP/seamreach-injected.txt"

          # The checked-in declaration is the half the invariant cannot cover:
          # `graphi mcp -labs` reaches all ten today and reached all ten on the
          # day the defect shipped, so the invariant held throughout. What was
          # missing was a file whose summary line changes, in the diff, when the
          # answer to "can a stock install reach any of this?" changes.
          go test ./internal/seamreach/ ./surfaces/mcp/ -run 'SW248' -count=1 -v

      # The seam's own kill-switch semantics, asserted directly: the three
      # positions install, the per-operation variable wins over the whole-seam
      # one, and an invalid value fails closed rather than degrading quietly.
      - name: kill-switch semantics
        run: go test ./cmd/internal/runtime/ ./internal/divergence/ ./internal/doctor/ ./internal/seamreach/ -count=1

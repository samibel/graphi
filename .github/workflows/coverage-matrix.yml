# SW-060 (FU-4): CI-enforced capability coverage matrix
#
# Proves the checked-in capability matrix (docs/coverage-matrix.yaml +
# docs/coverage-matrix.md) stays in lockstep with the live registries. A PR that
# adds or removes a parser, analyzer, MCP tool, or surface — or that edits the
# docs so they contradict the code — fails this check until the matrix is updated
# and regenerated.
#
# Three named steps make the result legible in the build summary:
#   unit-tests — internal/coverage guard logic (enumerator, parser, drift diff,
#                .md freshness, fake-analyzer FAIL->PASS demonstration, and the
#                SW-216 readme-claims kill tests)
#   gate       — the named check "coverage-matrix": derive the LIVE capability set
#                and fail (exit 1) on any drift or a stale docs/coverage-matrix.md.
#                Since SW-216 the SAME `-check` run also gates readme.md's
#                capability NUMBERS against docs/capability-manifest.json:
#                per-category counts, the census sentence's sum, and category set
#                completeness. Numbers only — prose is not gated (backlog :16
#                keeps its prose half open) and the check says so in its output.
#   tripwire   — proves the readme-claims gate BITES: TWO mutated readmes must
#                turn `-check` red — a drifted capability total, and the SW-215
#                defect shape (a category dropped from the decomposition, every
#                remaining count still correct, which only the SUM and
#                SET-COMPLETENESS assertions can catch). A gate nobody has seen
#                fail is not known to work (precedent: privacy-audit.yml's
#                egress tripwire).
#
# CGo-free, zero network — read-only over the registries.
name: coverage-matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage-matrix:
    name: coverage-matrix
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: unit-tests (coverage guard logic, CGO_ENABLED=0)
        run: go test ./internal/coverage/...

      - name: coverage-matrix (named check — drift + freshness + readme-claims gate)
        run: go run ./cmd/coverage -check

      # SW-216 AC-6: the gate must be SEEN to fail. Mutate readme.md, require
      # `-check` to go RED, then restore and require GREEN again. It runs on the
      # same checkout the gate above just passed, so this is evidence about THIS
      # commit rather than about a fixture. Both mutations are derived from the
      # file (no hard-coded count), and failing to mutate is itself a step
      # failure — a tripwire that silently no-ops proves nothing.
      #
      # TWO mutations, because the gate makes three assertions and round 1 only
      # exercised one of them in CI:
      #   (1) the TOTAL drifts            -> the per-count and SUM assertions
      #   (2) the last category is dropped -> the SUM and SET-COMPLETENESS
      #       assertions, i.e. the exact SW-215 defect this story exists for,
      #       with every individual count still correct.
      - name: readme-claims tripwire (mutated readme counts must fail the gate)
        run: |
          set -euo pipefail
          cp readme.md /tmp/readme.orig
          restore() { cp /tmp/readme.orig readme.md; }
          # `|| true`: under `set -e` a no-match grep would abort the step before
          # the actionable message below could be printed.
          expect_red() {
            if git diff --quiet -- readme.md; then
              restore
              echo "TRIPWIRE FAILED: could not mutate readme.md ($1) — fix the mutation, do not weaken the gate" >&2
              exit 1
            fi
            if go run ./cmd/coverage -check; then
              restore
              echo "TRIPWIRE FAILED: the gate stayed GREEN on a mutated readme ($1)" >&2
              exit 1
            fi
            restore
          }
          # The bold markers are optional on purpose: SW-217/SW-218 may unbold
          # the total, and CI must keep working rather than fail with no message.
          current="$(grep -oE 'counts \*{0,2}[0-9]+\*{0,2} capabilities' readme.md | grep -oE '[0-9]+' | head -1 || true)"
          if [ -z "${current}" ]; then
            echo "TRIPWIRE FAILED: no capability census sentence found in readme.md (expected 'counts <N> capabilities:')" >&2
            exit 1
          fi
          sed -i -E "s/(counts \*{0,2})${current}(\*{0,2} capabilities)/\1$((current + 1))\2/" readme.md
          expect_red "capability total incremented"
          # Drop the enumeration's trailing "and <N> <label>" clause: every count
          # left behind is still correct, so only SUM + SET COMPLETENESS can catch it.
          sed -i -E "/counts \*{0,2}[0-9]+\*{0,2} capabilities:/,/^[[:space:]]*$/ s/ and \*{0,2}[0-9]+\*{0,2} [A-Za-z]+( [A-Za-z]+)?\./\./" readme.md
          expect_red "last category dropped from the decomposition (the SW-215 defect)"
          go run ./cmd/coverage -check
          echo "tripwire OK: both mutations turned the gate red; the restored readme is green"

id: hcss-13-related-files-abstention
description: >
  related_files(base.main, dependents) — THE LOAD-BEARING §5.5 SCENARIO OF THIS
  SUITE, because this is the operation the language's cross-file construct
  would answer if graphi bound it.
  ABSTENTION SHAPE (css, per docs/plan/2026-08-per-language-ga-template-v1.md
  §5.5). THE LANGUAGE QUESTION FIRST: does CSS's own specification define a
  construct that names another file? YES — the CSS Syntax Module Level 3 (and
  CSS Cascading and Inheritance) specification defines the `@import` at-rule,
  `@import "base.css";`, which pulls another style sheet into the current one.
  This fixture uses it: theme/light.css and theme/dark.css both open with
  `@import "../base/tokens.css"`. graphi's CSS extractor mints selector
  symbols and records no import at all, so what this scenario asserts is an
  HONEST EMPTY — the construct is present in the source, and graphi declines
  to claim the relation rather than fabricating one. The abstention belongs to
  graphi, NOT to CSS, and it is justified here by the language specification
  named above; justifying it by graphi's own parser comment instead would be
  the LANGHONEST-001 circular-abstention defect.
  NON-VACUITY, STATED: unlike the structural operations above, this operation
  reports empty for an unresolved anchor too, so the empty result alone would
  not prove the anchor resolved. The paired control lives in the harness —
  TestHeroIntraParse_AbstentionAnchorsResolve re-asks the graph for base.main through
  the same fixture engine and fails unless a node whose qualified name is
  EXACTLY that anchor comes back. Exactness is the point: reference
  resolution falls back to lexical search when no exact qualified name
  matches, so a control that only asked whether something resolved would
  stay green after the anchor had been renamed away. So this scenario
  cannot pass by the anchor having quietly disappeared.
fixture_ref: tier1-fixture-hero-css
operation:
  name: related_files
  args:
    anchor: base.main
    direction: dependents
area: agent_mcp
expect:
  outcome: empty

id: hmd-09-references-abstention
description: >
  references(guide.Options) — graphi's markdown extractor records declarations only and
  mints no reference edge, intra-file or cross-file, so the reference relation
  is empty for every markdown symbol. NON-VACUITY, STATED: an unresolved anchor
  would report not_found, not empty, so reading empty here proves the anchor
  resolved.
  ABSTENTION SHAPE (markdown, per docs/plan/2026-08-per-language-ga-template-v1.md
  §5.5). THE LANGUAGE QUESTION FIRST: does Markdown's own specification define
  a construct that names another file? YES — the CommonMark specification
  defines the inline link `[text](./target.md)` and the link reference
  definition that backs it. This fixture uses it: guide/intro.md carries
  `[Configure](./setup.md)`. graphi's Markdown extractor mints heading symbols
  only and resolves no link destination, so what this scenario asserts is an
  HONEST EMPTY — the construct is present in the source, and graphi declines
  to claim the relation rather than fabricating one. The abstention belongs to
  graphi, NOT to Markdown, and it is justified here by the language
  specification named above; justifying it by graphi's own parser comment
  instead would be the LANGHONEST-001 circular-abstention defect.
fixture_ref: tier1-fixture-hero-markdown
operation:
  name: references
  args:
    symbol: guide.Options
area: agent_mcp
expect:
  outcome: empty

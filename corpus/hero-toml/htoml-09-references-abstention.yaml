id: htoml-09-references-abstention
description: >
  references(config.name) — graphi's toml extractor records declarations only and
  mints no reference edge, intra-file or cross-file, so the reference relation
  is empty for every toml symbol. NON-VACUITY, STATED: an unresolved anchor
  would report not_found, not empty, so reading empty here proves the anchor
  resolved.
  ABSTENTION SHAPE (toml, per docs/plan/2026-08-per-language-ga-template-v1.md
  §5.5). THE LANGUAGE QUESTION FIRST: does TOML's own specification define a
  construct that names another file? NO — the TOML v1.0.0 specification
  defines exactly one document per file: keys, values, tables, arrays of
  tables and inline tables, with no include, no import and no reference to
  another document. An `include = "other.toml"` key would be an ordinary
  string-valued key to which some host application may attach meaning, and
  TOML says nothing about it — which is why this fixture does not write one: a
  fixture that did would be grading the host application, not TOML. With no
  construct in the language there is nothing to resolve; this scenario
  substitutes the question and asserts the well-formed empty result. The
  abstention belongs to the LANGUAGE, not to graphi; citing graphi's own
  parser comment instead would be the LANGHONEST-001 circular-abstention
  defect.
fixture_ref: tier1-fixture-hero-toml
operation:
  name: references
  args:
    symbol: config.name
area: agent_mcp
expect:
  outcome: empty

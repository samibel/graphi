name: release-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      GOAMD64: "v1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # release-gate runs testgate; seamready's release-line evidence needs tags.
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Keep dependency-fetch diagnostics outside testgate's strict go test
      # producer stream, matching the dedicated test-gate workflow.
      - name: Download Go modules
        run: go mod download

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: cd web && npm ci

      # The workflow states a FACT — where this run is happening — and holds no
      # policy. What `pr` and `release` MEAN is decided in reviewed Go, in
      # cmd/release-gate/policy.go, beside the gates the rule protects. The only
      # thing the context changes is whether an UNVERIFIED gate blocks: on a
      # pull request a measurement that could not be taken is not a reason to
      # refuse a change; on `main` and the release path it is not an approval
      # either, so it blocks.
      #
      # A missing or misspelt value is not a loophole: release-gate rejects an
      # unknown context outright, and an absent one defaults to `release`, the
      # strict side.
      #
      # push-to-main and workflow_dispatch both take the release side.
      - name: Run release gate
        env:
          GATE_CONTEXT: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
        run: go run ./cmd/release-gate -publish -context="$GATE_CONTEXT"

# ── The GA-language axis: how GA-LANG-<lang>-G<n> rows must be shaped ───────
# Added 2026-08-19 (SW-180).
#
# AMENDED 2026-08-19 (SW-174, W1.a) — THE FIRST GA-LANG-* ROWS NOW EXIST.
# What this block said until this commit, and what it now says:
#
#   WAS: "There are ZERO GA-LANG-* ROWS in this file today, and that is why
#         internal/coverage.CheckGALanguages currently binds exactly one
#         ga-language matrix row (`go`, grandfathered)."
#   NOW: EIGHTEEN rows exist — GA-LANG-java-G1..G9 and GA-LANG-kotlin-G1..G9,
#        with G2 substituted by G2SUB at both (see rule 1). Every one is
#        UNKNOWN. `CheckGALanguages` still binds exactly the one `go`
#        ga-language matrix row, because java and kotlin have no matrix row —
#        that is the ordering constraint in rule 3 working, not an oversight.
#
# The first sentence was TRUE when written and is FALSE from this commit on. It
# is corrected here rather than left to be discovered, and what it used to say
# is quoted rather than deleted, per the §5.3 practice this programme runs
# under.
#
# AMENDED 2026-08-20 (SW-185, W3.b) — the intra-file-only / parse-only
# half of the Wave 3 residual lands. 54 rows added: GA-LANG-{css,hcl,json,
# markdown,toml,yaml}-G1..G9. At these levels G2 is NOT SUBSTITUTED — the
# language spec itself is the substituted gate (no cross-file contract to
# assert at all), and the row id keeps the canonical G2 name; the G2SUB
# substitution is a property of the cross-file-heuristic level only
# (SW-184's heuristic-resolver NEVER-CONFIRMED contract). The residual
# scaffold ships the rows at UNKNOWN; `CheckGALanguages` will report one
# violation per UNKNOWN row, which is the EXPECTED state at SW-185 close.
#
# ONE MORE SENTENCE ELSEWHERE IN THE TREE GOES STALE ON THIS COMMIT AND IS
# DELIBERATELY NOT FIXED: engine/semantic/semantic.go:11 justifies the
# default-off JVM registrants with "no GA-LANG-* evidence row exists". Eighteen
# now do. The REASON survives intact — none of them is green, and UNKNOWN
# counts as not passed — but the literal clause is false. It is left standing
# because engine/semantic is a COMPILED file, a pure comment in a compiled file
# is a product byte under this repository's provenance gate (2026-08-wave0
# handoff §8, measured), and SW-174 AC-8 forbids moving one. This is the
# D8-disclosure-versus-no-product-bytes tension that handoff already recorded as
# an open owner question, arriving again; it is disclosed here rather than
# resolved. Whoever next moves product bytes in engine/semantic should correct
# the clause to "no GREEN GA-LANG-* evidence row exists".
#
# Count ROWS, never mentions:
#
#     grep -c '^  - id: GA-LANG-' docs/rc/evidence-index.yaml     # -> 189
#
# THAT NUMBER IS EXPECTED TO RISE and is pinned only as of this commit: it is
# 189 = 18 (SW-174 java + kotlin) + 9 (SW-181 python) + 27 (SW-182 typescript
# family) + 81 (SW-184 cross-file-heuristic residual) + 54 (SW-185
# intra-file-only / parse-only residual), and SW-186 closes the axis. The
# property that must stay TRUE under every future edit is not the value — it
# is that the command counts ROWS and never counts a mention in this comment
# block.
#
# NOTE THE `- id:` ANCHOR, and do not replace it with a bare grep. A bare
# `grep -c 'GA-LANG-'` over this file counts the mentions inside THIS COMMENT
# BLOCK as well as the rows, so it can never be read as a row count. The first
# version of this block published exactly that bare command with `-> 0` beside
# it: a command falsified by the very comment that published it, and by its own
# commit. The template's §13 had already found and fixed that same defect in
# itself; the fix did not propagate here, into the published record and the
# higher-traffic surface. Row-anchored greps are stable under commentary. Bare
# ones are not.
#
# Before adding the first one, read
# docs/plan/2026-08-per-language-ga-template-v1.md §3 slot S14 and §4. Two
# rules it fixes that this file's own -check cannot enforce:
#
#   1. A SUBSTITUTED gate is never reported under the original gate's name.
#      A language below `typed-confirmed` proves its heuristic resolver's
#      contract instead of G2; its row id is GA-LANG-<lang>-G2SUB, never
#      GA-LANG-<lang>-G2. Both match the GA-LANG-<lang>- prefix that
#      CheckGALanguages (internal/coverage/galang.go:122) requires, so the
#      distinction is free — and it keeps
#
#          grep -c '^  - id: GA-LANG-.*-G2$' docs/rc/evidence-index.yaml   # -> 0
#
#      an honest answer to "which languages actually have a type-checker-proven
#      tier?".
#
#      CORRECTED 2026-08-19 (SW-174). This command ended in `-G2:` until this
#      commit and WAS DEAD: rows in this index are sequence items with no
#      trailing colon (`  - id: WP0`), so the anchored `-G2:` form returned 0
#      WHETHER OR NOT A G2 ROW EXISTED. It read 0 only because nothing could
#      ever match it. Found by SW-180's round-3 review (finding F1) against a
#      copy with a row appended; PROVEN AGAIN HERE against the real file with
#      this story's rows in it, which is the state that matters, because it is
#      the state that also proves the grep is not fooled by a substitute:
#
#        with a real GA-LANG-go-G2 row temporarily present, and the two real
#        G2SUB rows present:   -G2$ -> 1     -G2: -> 0
#        with the go row removed (the checked-in state):
#                              -G2$ -> 0     -G2: -> 0
#
#      So `-G2$` distinguishes the two states and `-G2:` cannot, and `-G2$`
#      does NOT match GA-LANG-java-G2SUB or GA-LANG-kotlin-G2SUB — which is the
#      whole property this bullet claims. A grep verified only against the case
#      where it has nothing to find is not verified.
#
#      ROW-ANCHORED, for the reason stated above: the first version of this
#      bullet published the BARE `grep 'GA-LANG-.*-G2:'` and called it honest.
#      The bare form counts THIS COMMENT BLOCK, so it can never read 0 while
#      the block exists, and its value RISES every time the block is edited.
#      NO NUMBER IS PINNED FOR THE BARE FORM HERE, deliberately: pinning one is
#      the same mistake one layer up, and it has already been made twice in
#      this file's history.
#   2. The row's `current` field carries the gate's EVIDENCE CLASS spelled out
#      (E0 ORACLE-PROVEN / E1 HARNESS-PROVEN / E2 CORPUS-MEASURED /
#      E3 DECLARED-AND-CHECKED; E4 DECLARED-ONLY may never read PASS).
#      Without it two rows that both read PASS assert claims of very different
#      strength and nothing on the surface distinguishes them. A gate's class
#      is the MINIMUM over the slots feeding it — e.g. a language with no
#      ground-truth oracle publishes G2SUB at E2, not at Java's class.
#
# Rows are BORN UNKNOWN. UNKNOWN counts as not passed; that is the point.
#
#   3. AND THE TWO OBLIGATIONS COMPOSE IN ONLY ONE ORDER. Read this before
#      creating a row: internal/coverage/galang.go:129-131 raises a violation
#      for EVERY GA-LANG-<lang>-* row that is not PASS — not merely for a
#      missing set. So "born UNKNOWN" is safe only while the language has NO
#      ga-language row in docs/coverage-matrix.yaml:
#
#        FIRST   create the GA-LANG-<lang>-G<n> rows, born UNKNOWN, while the
#                language is ABSENT from the coverage matrix. CheckGALanguages
#                iterates matrix rows (loop opens galang.go:96, `continue` at
#                :98) and `continue`s past
#                everything else, so a language with no matrix row is never
#                inspected and its UNKNOWN rows are invisible to the check.
#                This is SW-174.
#        LAST    add the ga-language matrix row, and only once every one of its
#                GA-LANG-* rows reads PASS with evidence_uri AND sha. This is
#                the flip (WP-J11 / SW-179).
#
#      REVERSING THAT ORDER FAILS `go run ./cmd/coverage -check` IMMEDIATELY.
#      The first version of this comment block said "Rows are BORN UNKNOWN"
#      and stopped there — draft 1 of the template's §3/S14 gave the same
#      advice, and the round-1 correction that added this ordering constraint
#      landed in the template and NOT here, in the file a story actually reads
#      before creating a row. A story following the unqualified advice lands a
#      red build. The mechanism is right — a matrix row is a GA CLAIM, and a
#      claim with an UNKNOWN gate under it should fail — but the claim and the
#      evidence must be created in that order.
#
#   4. THE ORDERING RULE ABOVE HAS NO ANSWER FOR A LANGUAGE THAT ALREADY HAS A
#      MATRIX ROW, AND EXACTLY ONE LANGUAGE IS IN THAT STATE: `go`.
#      Found and measured 2026-08-19 (SW-174). Rule 3 says rows are born
#      UNKNOWN *while the language is absent from the coverage matrix*. `go` is
#      NOT absent — docs/coverage-matrix.yaml has carried its ga-language row
#      since day one, grandfathered. So for `go` the two steps cannot be
#      ordered at all: the claim already exists, and the first UNKNOWN row
#      created under it turns the gate red immediately. Measured, not reasoned
#      — nine GA-LANG-go-G1..G9 rows were added to this file, `go run
#      ./cmd/coverage -check` was run, and the result was:
#
#        ga-language check FAILED — 9 violation(s):
#          - ga-language row "go": evidence gate GA-LANG-go-G1 does not read
#            PASS with evidence URI and sha (UNKNOWN/STALE/FAIL count as not
#            passed)
#          ... one per gate, G1 through G9 ...
#        exit status 1
#
#      The nine rows were then removed and the gate returned to green. THEY ARE
#      NOT IN THIS FILE. That is not the grandfathering being preserved — it is
#      the finding being published without turning CI red while the OWNER
#      decides, which is what SW-174 AC-6 asks for. Two resolutions exist and
#      both are the owner's, not a builder's:
#
#        (A) EVIDENCE — measure and populate all nine go gates so they read
#            PASS with evidence_uri and sha. That is Wave-1-scale work; this
#            index carries ZERO PASS rows of any kind today, so go's nine would
#            be the first, and G4 and G7 in particular cannot be measured until
#            the candidate moves.
#        (B) RE-GRADE — accept that under this programme's own rule (no GA
#            claim without a PASS row carrying URI and sha, which now binds go
#            too) go's ga-language matrix row is a claim its evidence no longer
#            backs, and withdraw it until the nine rows are green, restoring it
#            by exactly the SW-179 mechanism every other language uses.
#
#      (B) withdraws a published GA claim about the reference language and is
#      not a builder's call. Neither was taken here. Until one is, DO NOT
#      create GA-LANG-go-* rows: the build goes red the moment you do, and
#      removing them again is the one resolution AC-6 forbids.


id: htoml-01-index
description: >
  Indexing the toml fixture returns a populated inventory: every checked-in
  toml source file is walked and every declaration the toml node set admits
  is minted, so config/app.toml is present in the answer. This is the positive control
  the abstention scenarios in this suite lean on — if the fixture were not
  really indexed, this scenario is the one that goes red first.
fixture_ref: tier1-fixture-hero-toml
operation:
  name: index
area: agent_mcp
expect:
  outcome: found
  contains_path: config/app.toml

    note: "SW-144 CONFIRMED PARITY-001 ON REAL SOURCE, 2026-07-30. The hermetic reproduction below is no longer the only evidence: the real-repository matrix (internal/parity, docs/rc/parity-matrix-real-repo.md) reproduces the identical signature on cobra v1.8.0 at a0a6ae020bb3899ff0276067863e50523f897370. Deleting cobra.go - which declares WriteStringAndCheck, called by the in-module package doc through an intra-module import - yields INCREMENTAL 895 nodes / 3784 edges against FULL 897 nodes / 3789 edges. Full mints two interned external nodes plus the five edges pointing at them; one incremental apply mints neither, exactly as the phase-ordering cause below predicts. Snapshot envelope digests: incremental feadf1b63735, full f7e7bdde8cad. The blast radius is therefore confirmed as an ordinary refactor shape on a real 36-file library, not a fixture artifact. NOT FIXED, deliberately: it remains v0.7.2 batch item 3 behind SW-151 and SW-153, and SW-157's review established that the naive fix (purging before linkFiles) BREAKS SQLITE with 'edge references unknown node'. DOWNGRADED FROM PROVEN BY SW-157, AND THE CAUSE IS A GENUINE PRODUCT DEFECT, NOT A WEAKER TEST. Tracked as PARITY-001 (see known_defect), filed in projects/graphi/backlog.md, scheduled as v0.7.2 BATCH ITEM 3 behind SW-151 F4 residual and SW-153 freshness diagnosis. Measure-first stands: do NOT fix it early. THE HARNESS ROW DOES NOT ASSERT PARITY FOR THIS CLASS. It PINS the current wrong behaviour, so the defect is published as executable data and any change to it - including a FIX - turns the row red. PRECONDITION (CORRECTED IN REVIEW ROUND 1 - the first statement was TOO NARROW and understated the blast radius): deleting a file that declares a symbol which ANOTHER package calls through an intra-module import. It is NOT limited to the sole file of a package: a probe where the package SURVIVES via a second file diverges identically (6 nodes/5 edges vs 7/6), and so does one where the importer is EXPLICITLY in the change set. Controls that do NOT diverge: deleting a file nothing references, and deleting a SAME-package callee file (an unresolved same-package call mints no external node, so full has nothing extra either). This is an ordinary refactor shape - removing a function another package uses - so the blast radius is wide, not a corner case. OBSERVED on the harness fixture: FULL parse 5 nodes / 4 edges, ONE INCREMENTAL apply 4 nodes / 3 edges. Full mints an interned external node example.com/m/tax.Rate plus a heuristic calls edge shop.Checkout -> example.com/m/tax.Rate, reason external calls (unresolved import example.com/m/tax); one incremental apply mints neither. CAUSE - PHASE ORDERING, NOT THE DEPENDENT CASCADE (ALSO CORRECTED IN REVIEW ROUND 1; the first statement blamed dependentsOf and is REFUTED, because naming the importer explicitly in the change set - so it certainly IS re-parsed and re-linked - diverges identically. Whoever fixes this must not be sent to dependentsOf, where there is nothing to fix). engine/ingest/ingest.go:709 calls linkFiles BEFORE the deleted-path purge at :721-736. linkFiles builds its symbol index by streaming the LIVE store (engine/ingest/linkfiles.go:64-71, graphstore.ForEachNode over i.store), and the purge has not run yet, so tax.Rate is STILL A NODE; the linker resolves the call intra-module and never classifies it as an unresolved external. removeFileTx then deletes tax.Rate and cascades its edges away, leaving the graph one node and one edge short of full. That ordering also explains exactly why the SECOND apply converges: by then tax.Rate is already gone, linkFiles builds its index without it, resolution fails, and the external node is minted - the second apply does what the first should have. PERMANENT in the shipped path, not eventually-consistent: after the delete DriftSet returns empty and every further Reconcile is a no-op (verified over six reconciles, snapshot unmoved), so graphi sync stays diverged from graphi rebuild until a full rebuild. Backend-independent (byte-identical failure on MemStore and SQLite) and not a watcher or worker-pool artifact (reproduces with plain serial ing.IngestChanged, and independently through the shipped DriftDetail -> IngestChanged path that graphi sync drives). WHY THE VERDICT IS PARTIAL AND NOT SOMETHING STRONGER OR WEAKER, re-justified on the CORRECTED precondition: PROVEN is false; ABSENT is also false and is rejected by the guard, because real coverage exists and passes for the non-referenced sub-shapes (controls above). PARTIAL is the only remaining value in this file vocabulary, and it is no longer asked to carry the severity: known_defect: PARITY-001 does that, and the VERDICT guard direction makes PROVEN MECHANICALLY UNREACHABLE while known_defect is set, independent of whether the suite is green. Read known_defect, not verdict, when asking how bad this is. PRE-HARNESS PROVENANCE, retained: Step 3 removes b/b.go. Stronger sibling proofs: engine/ingest/link_e2e_test.go:43 deletes util/util.go, and engine/ingest/link_external_lifecycle_e2e_test.go:29 deletes the SOLE referencer of an interned external node. SQLite side absent."


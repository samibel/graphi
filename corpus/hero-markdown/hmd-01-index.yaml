id: hmd-01-index
description: >
  Indexing the markdown fixture returns a populated inventory: every checked-in
  markdown source file is walked and every declaration the markdown node set admits
  is minted, so guide/setup.md is present in the answer. This is the positive control
  the abstention scenarios in this suite lean on — if the fixture were not
  really indexed, this scenario is the one that goes red first.
fixture_ref: tier1-fixture-hero-markdown
operation:
  name: index
area: agent_mcp
expect:
  outcome: found
  contains_path: guide/setup.md

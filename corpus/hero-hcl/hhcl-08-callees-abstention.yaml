id: hhcl-08-callees-abstention
description: >
  callees(infra.region) — the hcl node set carries no callable construct, so no call
  edge is ever minted and there is no callee to name. NON-VACUITY, STATED: an
  unresolved anchor would report not_found, not empty, so reading empty here
  proves the anchor resolved.
  ABSTENTION SHAPE (hcl, per docs/plan/2026-08-per-language-ga-template-v1.md
  §5.5). THE LANGUAGE QUESTION FIRST: does HCL's own specification define a
  construct that names another file? NO — the HCL Native Syntax and Structure
  specifications (hashicorp/hcl) define bodies, blocks, attributes and
  expressions, and no include, no import and no source directive. Terraform's
  `module { source = "./mod" }` is a SCHEMA a host application layers on top
  of HCL: HCL hands the host an unevaluated body and the host decides what a
  block type and its labels mean, so it cannot be cited as HCL's answer —
  which is why this fixture writes no module block. With no construct in the
  language there is nothing to resolve; this scenario substitutes the question
  and asserts the well-formed empty result. The abstention belongs to the
  LANGUAGE, not to graphi; citing graphi's own parser comment instead would be
  the LANGHONEST-001 circular-abstention defect.
